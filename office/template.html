<title>AI 오피스</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 3D 사무실(Three.js). 팀 룸 5개가 가운데 미팅룸을 둘러싸고, 앞쪽 오른편이 주인님 룸.
   미니미는 방 사이 문을 지나 걸어 다닌다(자리 → 미팅룸 인계 → 막히면 주인님 룸 보고). 오른쪽 칸은 조종석·보고함·팀 현황·기록. */
:root {
  --ground: #dfe4e8; --ink: #23272e; --soft: #5d6470; --line: #d6cfc1; --paper: #fffdf8; --panel: #f4efe4;
  --accent: #2f5d8a;
  --ok: #1d7a4c; --ok-bg: #dcf1e5; --warn: #9a5b00; --warn-bg: #fdecc8; --bad: #c0261e; --bad-bg: #fde2df; --idle: #6b7280; --idle-bg: #e7e9ec;
  --display: 'Black Han Sans', 'Noto Sans KR', system-ui, sans-serif;
  --body: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --hand: 'Gowun Dodum', 'Noto Sans KR', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ground: #11151b; --ink: #eef0f3; --soft: #a3aab5; --line: #343a43; --paper: #161a20; --panel: #1d222a; --accent: #7fb0e0;
  --ok: #6fd3a0; --ok-bg: #173527; --warn: #f2c16b; --warn-bg: #3a2c10; --bad: #ff8a80; --bad-bg: #3d1a18; --idle: #9aa1ab; --idle-bg: #262b32;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --ground: #11151b; --ink: #eef0f3; --soft: #a3aab5; --line: #343a43; --paper: #161a20; --panel: #1d222a; --accent: #7fb0e0;
  --ok: #6fd3a0; --ok-bg: #173527; --warn: #f2c16b; --warn-bg: #3a2c10; --bad: #ff8a80; --bad-bg: #3d1a18; --idle: #9aa1ab; --idle-bg: #262b32;
  color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--ground); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55 }
.wrap { max-width: 1360px; margin: 0 auto; padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; margin-bottom: 12px }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(32px, 5vw, 46px); line-height: 1; margin: 0 }
h1 small { display: block; font-family: var(--body); font-size: 14.5px; font-weight: 500; color: var(--soft); margin-top: 8px }
.hstats { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 13.5px; color: var(--soft) }
.hstats b { font-family: var(--display); font-weight: 400; font-size: 22px; color: var(--ink); margin-right: 3px; font-variant-numeric: tabular-nums }
.power { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); color: var(--ink); font-weight: 700 }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none }
.alarm { display: flex; align-items: center; gap: 12px; background: var(--bad); color: #fff; border-radius: 10px; padding: 10px 14px; margin-bottom: 10px; font-weight: 700 }
.alarm .siren { width: 14px; height: 14px; border-radius: 50%; background: #fff; flex: none }
.alarm .msg { flex: 1; min-width: 0 } .alarm .msg span { font-weight: 400; opacity: .92 }
.alarm button { font: inherit; font-size: 13px; font-weight: 700; border: 0; border-radius: 999px; padding: 5px 12px; background: #fff; color: #9b1c15; cursor: pointer }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start }
@media (max-width: 1080px) { .layout { grid-template-columns: minmax(0, 1fr) } }

/* 3D 무대 */
.stage { position: relative; height: min(68vh, 640px); min-height: 420px; border-radius: 14px; overflow: hidden; background: var(--panel); border: 1px solid var(--line); touch-action: none }
.stage canvas { display: block; width: 100%; height: 100% }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden }
.lbl { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); white-space: nowrap; will-change: transform; text-align: center }
.nm { display: inline-block; font-size: 11px; font-weight: 700; background: rgb(255 253 248 / .92); color: #23272e; padding: 0 6px; border-radius: 4px; border: 1px solid #d6cfc1 }
.say { font-family: var(--hand); font-size: 13px; line-height: 1.35; background: #fffdf8; color: #23272e; border: 2px solid #23272e; border-radius: 10px; padding: 4px 9px; margin-bottom: 6px; position: relative }
.say::after { content: ""; position: absolute; left: 50%; bottom: -8px; margin-left: -6px; border: 6px solid transparent; border-top-color: #23272e; border-bottom: 0 }
.say.alert { border-color: #c0261e } .say.alert::after { border-top-color: #c0261e }
.rlbl { font-weight: 700; font-size: 12.5px; color: #23272e; background: rgb(255 253 248 / .88); padding: 2px 9px; border-radius: 999px; border: 1px solid #d6cfc1 }
.rlbl i { font-style: normal; font-weight: 700; font-size: 11px; margin-left: 5px }
.rlbl i.w { color: #9a5b00 } .rlbl i.b { color: #c0261e } .rlbl i.d { color: #1d7a4c }
.hint { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--soft); background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; pointer-events: none }
.view { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px }
.nogl { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--soft) }

/* 오른쪽 칸 */
.side { display: grid; gap: 14px }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0 }
.card h3 { margin: 0 0 10px; font-size: 12.5px; letter-spacing: .08em; color: var(--soft); font-weight: 700 }
.team { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px }
.team li { display: grid; grid-template-columns: 12px 58px auto minmax(0, 1fr); gap: 7px; align-items: baseline; font-size: 13px }
.team .sw { width: 10px; height: 10px; border-radius: 3px; align-self: center }
.team .t { font-family: var(--hand); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.tag { display: inline-flex; font-size: 11px; font-weight: 700; padding: 0 7px; border-radius: 999px }
.tag[data-s="idle"] { color: var(--idle); background: var(--idle-bg) } .tag[data-s="working"] { color: var(--warn); background: var(--warn-bg) }
.tag[data-s="done"] { color: var(--ok); background: var(--ok-bg) } .tag[data-s="blocked"] { color: var(--bad); background: var(--bad-bg) }
.memo ol { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13px }
.inbox { display: grid; gap: 8px; margin-top: 10px }
.report { border: 2px solid var(--bad); border-radius: 10px; padding: 9px 11px; font-size: 13.5px; background: var(--paper) }
.report.good { border-color: var(--ok) } .report b { display: block; font-size: 12.5px; margin-bottom: 2px }
.report .row { margin-top: 8px }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px }
.log li { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 8px; font-size: 13px }
.log time { font-family: var(--mono); font-size: 11.5px; color: var(--soft) }

.live-only { display: none } body.live .live-only { display: block }
.btn { font: inherit; font-weight: 700; font-size: 14px; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--paper) } .btn.small { padding: 5px 10px; font-size: 13px }
.btn:disabled { opacity: .45; cursor: not-allowed }
.btn:focus-visible, .alarm button:focus-visible, input:focus-visible { outline: 3px solid var(--warn); outline-offset: 2px }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.feed { font-family: var(--mono); font-size: 11.5px; line-height: 1.5; background: var(--panel); border-radius: 8px; padding: 9px 11px; max-height: 220px; overflow: auto; white-space: pre-wrap; word-break: break-all; margin-top: 10px }
.copybox { white-space: pre-wrap; font-size: 13px; background: var(--panel); border-radius: 8px; padding: 9px 11px; max-height: 200px; overflow: auto; margin: 8px 0 }
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--paper); color: var(--ink); padding: 22px; width: min(440px, calc(100vw - 32px)) }
dialog::backdrop { background: rgb(0 0 0 / .45) }
dialog h2 { margin: 0 0 6px; font-family: var(--display); font-weight: 400; font-size: 26px }
dialog label { display: block; font-size: 13px; color: var(--soft); margin: 14px 0 6px }
dialog input { width: 100%; font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink) }
.rm { display: grid; gap: 10px; margin-top: 8px }
.rm .who { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-weight: 700 }
.rm .task { font-family: var(--hand); font-size: 15px; margin-top: 2px }
.rm .when { font-family: var(--mono); font-size: 11.5px; color: var(--soft) }
.steps { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 6px; max-height: 260px; overflow: auto }
.steps li { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 8px; font-size: 13px; padding-bottom: 6px; border-bottom: 1px dashed var(--line) }
.steps time { font-family: var(--mono); font-size: 11.5px; color: var(--soft) }
#roomDlg { width: min(520px, calc(100vw - 32px)) }
.tin { font: inherit; font-size: 13.5px; padding: 5px 6px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font-variant-numeric: tabular-nums }
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chip { font-size: 12.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line) }
.chip b { font-family: var(--display); font-weight: 400; font-size: 16px; margin-right: 3px }
.tabs .btn[aria-selected="true"] { background: var(--accent); color: var(--paper); border-color: var(--accent) }
table.board { width: 100%; border-collapse: collapse; font-size: 12.5px }
.board td { padding: 6px 4px; border-top: 1px dashed var(--line); vertical-align: top }
.board .id { font-family: var(--mono); color: var(--soft); width: 30px }
.board .t { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.st { display: inline-block; font-weight: 700; font-size: 11px; padding: 0 7px; border-radius: 999px; white-space: nowrap }
.st.pub { color: var(--ok); background: var(--ok-bg) } .st.sch { color: var(--accent); background: var(--panel); border: 1px solid var(--accent) }
.st.pri { color: var(--warn); background: var(--warn-bg) } .st.none { color: var(--idle); background: var(--idle-bg) }
.err { color: var(--bad); font-size: 13px; min-height: 1.2em; margin-top: 8px }
@media (prefers-reduced-motion: no-preference) { .alarm .siren { animation: blink 1s steps(2, start) infinite } }
@keyframes blink { to { opacity: .25 } }
</style>

<div class="wrap">
  <header>
    <h1>AI 오피스<small>나도!지식 한입만 · 블로그 제작팀</small></h1>
    <div class="hstats" id="hstats"></div>
  </header>
  <div id="alarms"></div>
  <div class="layout">
    <section class="stage" id="stage" aria-label="3D 사무실">
      <div class="labels" id="labels"></div>
      <div class="hint" id="hint">끌어서 돌리기 · 휠로 확대</div>
      <div class="view"><button class="btn small" type="button" id="viewTop">위에서</button><button class="btn small" type="button" id="viewReset">기본 시점</button></div>
    </section>
    <aside class="side">
      <div class="card live-only" id="control"><h3>제작 조종석</h3>
        <div id="ctlState" style="font-weight:700;font-size:14px"></div>
        <div class="row" style="margin-top:10px">
          <button class="btn primary" id="openStart" type="button">기획 시작</button>
          <button class="btn" id="btnUpload" type="button">업로드만 다시</button>
          <button class="btn" id="btnStop" type="button">멈춤</button>
        </div>
        <div class="row" style="margin-top:10px;font-size:13.5px" role="radiogroup" aria-label="업로드 방식">
          <b style="font-size:12.5px;color:var(--soft)">업로드 방식</b>
          <label><input type="radio" name="um" id="umPrivate" value="private"> 비공개 저장</label>
          <label><input type="radio" name="um" id="umSchedule" value="schedule"> 예약 발행</label>
        </div>
        <div class="row" id="atRow" style="margin-top:6px;font-size:13.5px" hidden>
          <label for="schedAt" style="font-size:12.5px;color:var(--soft);font-weight:700">다음 글 공개 시간</label>
          <span id="schedAt" style="display:inline-flex;align-items:center;gap:4px">
            <input type="date" id="schedDate" aria-label="날짜" class="tin" style="width:9.5em">
            <select id="schedH" aria-label="시(24시 기준)" class="tin"></select><b>:</b>
            <select id="schedM" aria-label="분" class="tin"></select>
          </span>
          <button class="btn small" type="button" id="atSave">이 시간으로</button>
          <button class="btn small" type="button" id="atAuto">자동(주말 빈 시간)</button>
          <span id="atMsg" style="flex-basis:100%;color:var(--soft);font-size:12.5px"></span>
        </div>
        <div id="sched" style="font-size:13px;margin-top:6px"></div>
        <div class="feed" id="feed" aria-live="polite"></div>
      </div>
      <div class="card live-only" id="boardCard"><h3>발행 현황</h3>
        <div class="chips" id="boardSum"></div>
        <div class="row tabs" role="tablist" style="margin:10px 0 6px">
          <button class="btn small" type="button" data-f="todo" role="tab">미발행</button>
          <button class="btn small" type="button" data-f="sched" role="tab">예약</button>
          <button class="btn small" type="button" data-f="pub" role="tab">발행됨</button>
          <button class="btn small" type="button" data-f="all" role="tab">전체</button>
        </div>
        <div style="overflow-x:auto"><table class="board" id="board"></table></div>
      </div>
      <div class="card"><h3>주인님 보고함</h3>
        <div class="memo"><ol id="todo"></ol></div>
        <div class="inbox" id="inbox"></div>
      </div>
      <div class="card live-only" id="resultCard" hidden><h3>방금 만든 글</h3><div id="result"></div></div>
      <div class="card"><h3>팀 현황</h3><ul class="team" id="team"></ul></div>
      <div class="card"><h3>작업 기록</h3><ul class="log" id="log"></ul></div>
    </aside>
  </div>
</div>

<dialog id="roomDlg" aria-labelledby="roomTitle">
  <h2 id="roomTitle"></h2>
  <div id="roomBody"></div>
  <div class="row" style="justify-content:flex-end;margin-top:14px">
    <button class="btn primary" type="button" id="roomStart" hidden>기획 시작</button>
    <button class="btn" type="button" id="roomClose">닫기</button>
  </div>
</dialog>

<dialog id="startDlg">
  <form method="dialog">
    <h2>기획 시작</h2>
    <div style="color:var(--soft);font-size:14px">글 1편을 만들고, 끝나면 티스토리에 비공개로 올려요. 20~40분 걸려요.</div>
    <label for="topic">주제 (비워 두면 기획팀이 차례대로 골라요)</label>
    <input id="topic" name="topic" placeholder="예: 연말정산 미리보기 2026" autocomplete="off">
    <div class="err" id="startErr"></div>
    <div class="row" style="justify-content:flex-end;margin-top:12px">
      <button class="btn" value="cancel" type="submit" formnovalidate>취소</button>
      <button class="btn primary" id="startGo" type="button">시작</button>
    </div>
  </form>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

const fmt = iso => { const d = new Date(iso); if (isNaN(d)) return '';
  const k = new Date(d.getTime() + 9 * 3600e3);
  return `${k.getUTCMonth() + 1}/${k.getUTCDate()} ${String(k.getUTCHours()).padStart(2, '0')}:${String(k.getUTCMinutes()).padStart(2, '0')}`; };
const TEAM = [   // 키, 이름, 방, 옷 색, 머리 색, 머리 모양, 소품
  ['planner', '기획·리서치', 'plan', 0x4c7bd9, 0x2b2118, 'bob', 'clipboard'],

];

};
const DOORS = { 'plan|meet': [-4.85, -6], 'write|meet': [-4.85, 0], 'design|meet': [4.85, -6], 'review|meet': [4.85, 0],
  'audit|meet': [0, 3.05], 'audit|owner': [4.85, 6], 'upload|audit': [-4.85, 6], 'review|owner': [10, 3.05] };
const STAIRS = { 'upload|naver': [[-10, 8.9, 0], [-10, 9.3, 0], [-10, 11.3, -2.6]] };
Object.keys(STAIRS).forEach(k => DOORS[k] = STAIRS[k][0]);

const door = (a, b) => STAIRS[a + '|' + b] || (STAIRS[b + '|' + a] ? [...STAIRS[b + '|' + a]].reverse() : [[...(DOORS[a + '|' + b] || DOORS[b + '|' + a]), 0]]);

function route(fromRoom, toRoom) {
  if (fromRoom === toRoom) return [];
  const prev = { [fromRoom]: null }, q = [fromRoom];
  while (q.length) { const r = q.shift(); if (r === toRoom) break; (LINKS[r] || []).forEach(n => { if (!(n in prev)) { prev[n] = r; q.push(n); } }); }
  const path = []; let c = toRoom; while (prev[c] != null) { path.unshift(...door(prev[c], c)); c = prev[c]; }
  return path;
}

  upload: '티스토리 비공개·예약 발행(PC)', audit: '3편마다 SEO·GEO·AEO·규제·트렌드 점검 → 지침(GUIDE.md) 갱신',
  owner: '최종 확인 · 공개 · 네이버 업로드', naver: '네이버 묶음 반자동 업로드(붙여넣기·발행은 주인님)' };
const hm = iso => { const f = fmt(iso); return f ? f.split(' ')[1] : ''; };
function openRoom(room) {
  const D = window._D || {}, M = D.members || {};
  const who = room === 'owner' ? [] : room === 'meet' ? [] : TEAM.filter(t => t[2] === room).map(t => t[0]);
  document.getElementById('roomTitle').textContent = ROOMS[room].name;
  let html = `<div style="color:var(--soft);font-size:13.5px">${ROOM_JOB[room]}</div><div class="rm">`;
  who.forEach(k => { const m = M[k] || { state: 'idle', task: '' };
    html += `<div><div class="who">${NAME[k]} <span class="tag" data-s="${m.state}">${S[m.state]}</span><span class="when">${fmt(m.at)}</span></div><div class="task">${esc(m.task)}</div></div>`; });
  if (room === 'naver') { const nv = D.naver || [];
    html += nv.length ? `<div><b>올릴 글 ${nv.length}편</b><ul style="margin:6px 0 0;padding-left:18px">${nv.map(x => `<li>${D.live ? `<a href="/naver/${encodeURIComponent(x.slug)}" target="_blank" rel="noopener">${esc(x.title)}</a>` : esc(x.title)}</li>`).join('')}</ul>${D.live ? '' : '<div style="color:var(--soft);font-size:12.5px;margin-top:4px">PC의 AI 오피스에서 누르면 네이버 올리기 화면이 열려요.</div>'}</div>` : '<div>네이버에 올릴 글이 없어요.</div>'; }
  if (room === 'owner') html += `<div><b>오늘 할 일</b><ol style="margin:6px 0 0;padding-left:18px">${(D.todo || []).map(t => `<li>${esc(t)}</li>`).join('')}</ol></div>`;
  html += '</div>';
  const keys = room === 'meet' ? ORDER : room === 'owner' ? ['human', 'uploader', 'reviewer'] : room === 'review' ? ['reviewer', 'deploy'] : room === 'plan' ? ['planner', 'research'] : who;
  const steps = (D.log || []).filter(l => keys.includes(l.who)).slice(0, 30);
  const feed = room === 'meet' ? (D.log || []).filter(l => / → .+에게 넘김/.test(l.msg)).slice(0, 20) : steps;
  html += `<b style="display:block;margin-top:14px;font-size:13px;color:var(--soft)">${room === 'meet' ? '인계 기록' : '진행 기록'}</b>`;
  html += feed.length ? `<ul class="steps">${feed.map(l => `<li><time>${hm(l.at)}</time><span>${room === 'meet' || who.length > 1 || room === 'owner' ? `<b>${NAME[l.who] || esc(l.who)}</b> ` : ''}${esc(l.msg)}</span></li>`).join('')}</ul>`
    : '<div style="color:var(--soft);font-size:13px;margin-top:6px">아직 기록이 없어요.</div>';
  document.getElementById('roomBody').innerHTML = html;
  const rs = document.getElementById('roomStart');
  rs.hidden = !(room === 'plan' && D.live); rs.disabled = document.getElementById('openStart').disabled;
  const dlg = document.getElementById('roomDlg'); dlg.dataset.room = room;
  if (!dlg.open) dlg.showModal();
}
function pickRoom(ev) {   // 방 바닥을 누르면 그 방의 진행 상황
  if (!scene) return;
  const rect = renderer.domElement.getBoundingClientRect();
  const ray = new THREE.Raycaster(); ray.setFromCamera({ x: (ev.clientX - rect.left) / rect.width * 2 - 1, y: -(ev.clientY - rect.top) / rect.height * 2 + 1 }, camera);
  const hit = ray.intersectObjects(Object.values(roomFx).map(f => f.floor))[0];
  if (hit) openRoom(Object.keys(roomFx).find(k => roomFx[k].floor === hit.object));
}
document.getElementById('roomClose').onclick = () => document.getElementById('roomDlg').close();
document.getElementById('roomStart').onclick = () => { document.getElementById('roomDlg').close(); openStart(); };

initThree();
const D0 = JSON.parse(document.getElementById('data').textContent);
render(D0);
document.getElementById('viewTop').onclick = () => setView('top');
document.getElementById('viewReset').onclick = () => setView('reset');
{ let down = null;
  stage.addEventListener('pointerdown', e => down = [e.clientX, e.clientY]);
  stage.addEventListener('pointerup', e => { if (down && Math.hypot(e.clientX - down[0], e.clientY - down[1]) < 5) pickRoom(e); down = null; }); }
document.getElementById('hint').textContent = '끌어서 돌리기 · 휠로 확대 · 방을 누르면 진행 상황';
if (D0.live && location.protocol.startsWith('http')) {
  document.getElementById('openStart').onclick = openStart;
  document.getElementById('startGo').onclick = async () => {
    try { await post('/api/start', { topic: document.getElementById('topic').value }); document.getElementById('startDlg').close(); poll(); }
    catch (e) { document.getElementById('startErr').textContent = e.message; }
  };
  document.getElementById('topic').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); document.getElementById('startGo').click(); } });
  document.getElementById('btnUpload').onclick = () => post('/api/upload').then(poll, e => alert(e.message));
  document.getElementById('btnStop').onclick = () => post('/api/stop').then(poll);
  document.querySelectorAll('input[name="um"]').forEach(r => r.onchange = () => post('/api/settings', { upload_mode: r.value }).then(poll));
  const si = document.getElementById('schedAt'), sd = document.getElementById('schedDate'), sh = document.getElementById('schedH'), sm = document.getElementById('schedM');
  const pad = n => String(n).padStart(2, '0');
  sh.innerHTML = Array.from({ length: 24 }, (_, i) => `<option value="${pad(i)}">${pad(i)}시</option>`).join('');
  sm.innerHTML = Array.from({ length: 12 }, (_, i) => `<option value="${pad(i * 5)}">${pad(i * 5)}분</option>`).join('');
  sh.value = '09'; sm.value = '00';
  { const d = new Date(); sd.min = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
  [sd, sh, sm].forEach(e => e.addEventListener('input', () => si.dataset.touched = '1'));
  document.getElementById('atSave').onclick = () => { if (!sd.value) { document.getElementById('atMsg').textContent = '날짜를 먼저 골라 주세요.'; return; }
    post('/api/settings', { schedule_at: `${sd.value} ${sh.value}:${sm.value}` }).then(() => { si.dataset.touched = ''; poll(); }, e => document.getElementById('atMsg').textContent = e.message); };
  document.getElementById('atAuto').onclick = () => post('/api/settings', { schedule_at: '' }).then(() => { sd.value = ''; si.dataset.touched = ''; poll(); });
  setInterval(poll, 3000);
}
</script>
