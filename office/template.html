<title>AI 오피스</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: 3D 사무실(Three.js). 팀 룸 5개가 가운데 미팅룸을 둘러싸고, 앞쪽 오른편이 주인님 룸.
   미니미는 방 사이 문을 지나 걸어 다닌다(자리 → 미팅룸 인계 → 막히면 주인님 룸 보고). 오른쪽 칸은 조종석·보고함·팀 현황·기록. */
:root {
  --ground: #dfe4e8; --ink: #23272e; --soft: #5d6470; --line: #d6cfc1; --paper: #fffdf8; --panel: #f4efe4;
  --accent: #2f5d8a;
  --ok: #1d7a4c; --ok-bg: #dcf1e5; --warn: #9a5b00; --warn-bg: #fdecc8; --bad: #c0261e; --bad-bg: #fde2df; --idle: #6b7280; --idle-bg: #e7e9ec;
  --display: 'Black Han Sans', 'Noto Sans KR', system-ui, sans-serif;
  --body: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --hand: 'Gowun Dodum', 'Noto Sans KR', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --ground: #11151b; --ink: #eef0f3; --soft: #a3aab5; --line: #343a43; --paper: #161a20; --panel: #1d222a; --accent: #7fb0e0;
  --ok: #6fd3a0; --ok-bg: #173527; --warn: #f2c16b; --warn-bg: #3a2c10; --bad: #ff8a80; --bad-bg: #3d1a18; --idle: #9aa1ab; --idle-bg: #262b32;
  color-scheme: dark } }
:root[data-theme="dark"] {
  --ground: #11151b; --ink: #eef0f3; --soft: #a3aab5; --line: #343a43; --paper: #161a20; --panel: #1d222a; --accent: #7fb0e0;
  --ok: #6fd3a0; --ok-bg: #173527; --warn: #f2c16b; --warn-bg: #3a2c10; --bad: #ff8a80; --bad-bg: #3d1a18; --idle: #9aa1ab; --idle-bg: #262b32;
  color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--ground); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55 }
.wrap { max-width: 1360px; margin: 0 auto; padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; margin-bottom: 12px }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(32px, 5vw, 46px); line-height: 1; margin: 0 }
h1 small { display: block; font-family: var(--body); font-size: 14.5px; font-weight: 500; color: var(--soft); margin-top: 8px }
.hstats { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; font-size: 13.5px; color: var(--soft) }
.hstats b { font-family: var(--display); font-weight: 400; font-size: 22px; color: var(--ink); margin-right: 3px; font-variant-numeric: tabular-nums }
.power { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); color: var(--ink); font-weight: 700 }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none }
.alarm { display: flex; align-items: center; gap: 12px; background: var(--bad); color: #fff; border-radius: 10px; padding: 10px 14px; margin-bottom: 10px; font-weight: 700 }
.alarm .siren { width: 14px; height: 14px; border-radius: 50%; background: #fff; flex: none }
.alarm .msg { flex: 1; min-width: 0 } .alarm .msg span { font-weight: 400; opacity: .92 }
.alarm button { font: inherit; font-size: 13px; font-weight: 700; border: 0; border-radius: 999px; padding: 5px 12px; background: #fff; color: #9b1c15; cursor: pointer }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start }
@media (max-width: 1080px) { .layout { grid-template-columns: minmax(0, 1fr) } }

/* 3D 무대 */
.stage { position: relative; height: min(68vh, 640px); min-height: 420px; border-radius: 14px; overflow: hidden; background: var(--panel); border: 1px solid var(--line); touch-action: none }
.stage canvas { display: block; width: 100%; height: 100% }
.labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden }
.lbl { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); white-space: nowrap; will-change: transform; text-align: center }
.nm { display: inline-block; font-size: 11px; font-weight: 700; background: rgb(255 253 248 / .92); color: #23272e; padding: 0 6px; border-radius: 4px; border: 1px solid #d6cfc1 }
.say { font-family: var(--hand); font-size: 13px; line-height: 1.35; background: #fffdf8; color: #23272e; border: 2px solid #23272e; border-radius: 10px; padding: 4px 9px; margin-bottom: 6px; position: relative }
.say::after { content: ""; position: absolute; left: 50%; bottom: -8px; margin-left: -6px; border: 6px solid transparent; border-top-color: #23272e; border-bottom: 0 }
.say.alert { border-color: #c0261e } .say.alert::after { border-top-color: #c0261e }
.rlbl { font-weight: 700; font-size: 12.5px; color: #23272e; background: rgb(255 253 248 / .88); padding: 2px 9px; border-radius: 999px; border: 1px solid #d6cfc1 }
.rlbl i { font-style: normal; font-weight: 700; font-size: 11px; margin-left: 5px }
.rlbl i.w { color: #9a5b00 } .rlbl i.b { color: #c0261e } .rlbl i.d { color: #1d7a4c }
.hint { position: absolute; left: 12px; bottom: 10px; font-size: 12px; color: var(--soft); background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; pointer-events: none }
.view { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 6px }
.nogl { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--soft) }

/* 오른쪽 칸 */
.side { display: grid; gap: 14px }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; min-width: 0 }
.card h3 { margin: 0 0 10px; font-size: 12.5px; letter-spacing: .08em; color: var(--soft); font-weight: 700 }
.team { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px }
.team li { display: grid; grid-template-columns: 12px 58px auto minmax(0, 1fr); gap: 7px; align-items: baseline; font-size: 13px }
.team .sw { width: 10px; height: 10px; border-radius: 3px; align-self: center }
.team .t { font-family: var(--hand); font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.tag { display: inline-flex; font-size: 11px; font-weight: 700; padding: 0 7px; border-radius: 999px }
.tag[data-s="idle"] { color: var(--idle); background: var(--idle-bg) } .tag[data-s="working"] { color: var(--warn); background: var(--warn-bg) }
.tag[data-s="done"] { color: var(--ok); background: var(--ok-bg) } .tag[data-s="blocked"] { color: var(--bad); background: var(--bad-bg) }
.memo ol { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13px }
.inbox { display: grid; gap: 8px; margin-top: 10px }
.report { border: 2px solid var(--bad); border-radius: 10px; padding: 9px 11px; font-size: 13.5px; background: var(--paper) }
.report.good { border-color: var(--ok) } .report b { display: block; font-size: 12.5px; margin-bottom: 2px }
.report .row { margin-top: 8px }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px }
.log li { display: grid; grid-template-columns: 70px minmax(0, 1fr); gap: 8px; font-size: 13px }
.log time { font-family: var(--mono); font-size: 11.5px; color: var(--soft) }

.live-only { display: none } body.live .live-only { display: block }
.btn { font: inherit; font-weight: 700; font-size: 14px; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--paper) } .btn.small { padding: 5px 10px; font-size: 13px }
.btn:disabled { opacity: .45; cursor: not-allowed }
.btn:focus-visible, .alarm button:focus-visible, input:focus-visible { outline: 3px solid var(--warn); outline-offset: 2px }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.feed { font-family: var(--mono); font-size: 11.5px; line-height: 1.5; background: var(--panel); border-radius: 8px; padding: 9px 11px; max-height: 220px; overflow: auto; white-space: pre-wrap; word-break: break-all; margin-top: 10px }
.copybox { white-space: pre-wrap; font-size: 13px; background: var(--panel); border-radius: 8px; padding: 9px 11px; max-height: 200px; overflow: auto; margin: 8px 0 }
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--paper); color: var(--ink); padding: 22px; width: min(440px, calc(100vw - 32px)) }
dialog::backdrop { background: rgb(0 0 0 / .45) }
dialog h2 { margin: 0 0 6px; font-family: var(--display); font-weight: 400; font-size: 26px }
dialog label { display: block; font-size: 13px; color: var(--soft); margin: 14px 0 6px }
dialog input { width: 100%; font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink) }
.err { color: var(--bad); font-size: 13px; min-height: 1.2em; margin-top: 8px }
@media (prefers-reduced-motion: no-preference) { .alarm .siren { animation: blink 1s steps(2, start) infinite } }
@keyframes blink { to { opacity: .25 } }
</style>

<div class="wrap">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script id="data" type="application/json">__OFFICE_DATA__</script>
<script>
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = iso => { const d = new Date(iso); if (isNaN(d)) return '';
  const k = new Date(d.getTime() + 9 * 3600e3);
  return `${k.getUTCMonth() + 1}/${k.getUTCDate()} ${String(k.getUTCHours()).padStart(2, '0')}:${String(k.getUTCMinutes()).padStart(2, '0')}`; };
const TEAM = [   // 키, 이름, 방, 몸 색, 머리 색
  ['planner', '기획', 'plan', 0x3a6fb0, 0x2b2118], ['research', '리서치', 'plan', 0x2f8f8a, 0x5a3a22],
  ['writer', '작가', 'write', 0x8a5cb8, 0x1d1d1d], ['designer', '디자이너', 'design', 0xd0663a, 0xc9893f],
  ['reviewer', '검수', 'review', 0x2f8f5b, 0x2b2118], ['deploy', '배포', 'review', 0xb08a2f, 0x3b2a1a],
  ['uploader', '업로드', 'upload', 0x546170, 0x1d1d1d],
];
const ORDER = TEAM.map(t => t[0]);
const NAME = Object.fromEntries(TEAM.map(t => [t[0], t[1]])); NAME.human = '주인님';
const S = { idle: '대기', working: '일하는 중', done: '완료', blocked: '막힘' };
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- 사무실 배치(바닥 좌표: x 왼→오, z 뒤→앞) ----------
const ROOMS = {
  plan:   { name: '기획팀', x: -10, z: -6, w: 9.4, d: 5.8, floor: 0xd9b98c },
  meet:   { name: '미팅룸', x: 0, z: -3, w: 9.4, d: 11.8, floor: 0x9fbccb },
  design: { name: '디자인 스튜디오', x: 10, z: -6, w: 9.4, d: 5.8, floor: 0xd9b98c },
  write:  { name: '작가실', x: -10, z: 0, w: 9.4, d: 5.8, floor: 0xd9b98c },
  review: { name: '검수·배포실', x: 10, z: 0, w: 9.4, d: 5.8, floor: 0xd9b98c },
  upload: { name: '업로드실', x: -10, z: 6, w: 9.4, d: 5.8, floor: 0xd9b98c },
  owner:  { name: '주인님 룸', x: 5, z: 6, w: 19.4, d: 5.8, floor: 0xc8aedb },
};
const DOORS = { 'plan|meet': [-4.85, -6], 'write|meet': [-4.85, 0], 'design|meet': [4.85, -6], 'review|meet': [4.85, 0],
  'owner|meet': [0, 3.05], 'upload|owner': [-4.85, 6] };
const LINKS = {}; Object.keys(DOORS).forEach(k => { const [a, b] = k.split('|'); (LINKS[a] = LINKS[a] || []).push(b); (LINKS[b] = LINKS[b] || []).push(a); });
const door = (a, b) => DOORS[a + '|' + b] || DOORS[b + '|' + a];
// 자리: [x, z, 방, 바라보는 방향(라디안, 0 = 화면 쪽)]
const SEATS = {
  planner: [-12, -6.6, 'plan', 0], research: [-8, -6.6, 'plan', 0], designer: [10, -6.6, 'design', 0],
  writer: [-10, -0.6, 'write', 0], reviewer: [8, -0.6, 'review', 0], deploy: [12, -0.6, 'review', 0], uploader: [-10, 5.4, 'upload', 0],
  me: [5, 5.0, 'owner', 0], v1: [3.6, 7.6, 'owner', Math.PI], v2: [6.4, 7.6, 'owner', Math.PI],
  m1: [-1.9, -3, 'meet', Math.PI / 2], m2: [1.9, -3, 'meet', -Math.PI / 2],
};
function route(fromRoom, toRoom) {   // 방 사이 문 순서(너비 우선 탐색)
  if (fromRoom === toRoom) return [];
  const prev = { [fromRoom]: null }, q = [fromRoom];
  while (q.length) { const r = q.shift(); if (r === toRoom) break; (LINKS[r] || []).forEach(n => { if (!(n in prev)) { prev[n] = r; q.push(n); } }); }
  const path = []; let c = toRoom; while (prev[c] != null) { path.unshift(door(prev[c], c)); c = prev[c]; }
  return path;
}

// ---------- 3D ----------
const stage = document.getElementById('stage'), labels = document.getElementById('labels');
let renderer, scene, camera, controls, clock, three = !!window.THREE;
const minis = {}, roomFx = {}, roomLbl = {};
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function mat(color, extra) { return new THREE.MeshStandardMaterial(Object.assign({ color, roughness: .75, metalness: 0 }, extra || {})); }
function box(w, h, d, color, x, y, z) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color)); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; scene.add(m); return m; }

function buildOffice() {
  const g = new THREE.Mesh(new THREE.PlaneGeometry(80, 60), mat(0x8f8a80)); g.rotation.x = -Math.PI / 2; g.position.y = -0.02; g.receiveShadow = true; scene.add(g);
  Object.entries(ROOMS).forEach(([k, r]) => {
    const fl = new THREE.Mesh(new THREE.BoxGeometry(r.w, .12, r.d), mat(r.floor)); fl.position.set(r.x, .06, r.z); fl.receiveShadow = true; scene.add(fl);
    // 벽(문 자리는 비움). 앞쪽(+z) 벽은 낮게 해서 안이 보이게
    const H = 1.5, T = .16, sides = [
      { x1: r.x - r.w / 2, z1: r.z - r.d / 2, x2: r.x + r.w / 2, z2: r.z - r.d / 2, h: H },
      { x1: r.x - r.w / 2, z1: r.z + r.d / 2, x2: r.x + r.w / 2, z2: r.z + r.d / 2, h: .35 },
      { x1: r.x - r.w / 2, z1: r.z - r.d / 2, x2: r.x - r.w / 2, z2: r.z + r.d / 2, h: H },
      { x1: r.x + r.w / 2, z1: r.z - r.d / 2, x2: r.x + r.w / 2, z2: r.z + r.d / 2, h: H }];
    const gaps = Object.values(DOORS);
    sides.forEach(s => {
      const horiz = s.z1 === s.z2, a = horiz ? s.x1 : s.z1, b = horiz ? s.x2 : s.z2, fixed = horiz ? s.z1 : s.x1;
      const cuts = gaps.filter(([gx, gz]) => horiz ? Math.abs(gz - fixed) < .3 && gx > a && gx < b : Math.abs(gx - fixed) < .3 && gz > a && gz < b)
        .map(([gx, gz]) => horiz ? gx : gz).sort((p, q) => p - q);
      let start = a; [...cuts, null].forEach(c => { const end = c == null ? b : c - .9; if (end - start > .05) {
        const len = end - start, mid = (start + end) / 2;
        horiz ? box(len, s.h, T, 0xe8e4dc, mid, s.h / 2, fixed) : box(T, s.h, len, 0xe8e4dc, fixed, s.h / 2, mid); }
        if (c != null) start = c + .9; });
    });
    // 경광등(막힘 때 깜빡임)
    const bc = new THREE.Mesh(new THREE.SphereGeometry(.22, 16, 12), mat(0x661111, { emissive: 0x000000 })); bc.position.set(r.x + r.w / 2 - .5, H + .25, r.z - r.d / 2 + .3); scene.add(bc);
    const pl = new THREE.PointLight(0xff3020, 0, 6); pl.position.set(r.x, 2.4, r.z); scene.add(pl);
    roomFx[k] = { floor: fl, beacon: bc, light: pl, screens: [] };
    const el = document.createElement('div'); el.className = 'lbl rlbl'; el.textContent = r.name; labels.appendChild(el);
    roomLbl[k] = { el, pos: new THREE.Vector3(r.x - r.w / 2 + 1.6, H + .6, r.z - r.d / 2) };
  });
  // 책상(팀원 자리 앞 +z쪽)
  Object.entries(SEATS).forEach(([k, [x, z, room]]) => {
    if (/^[mv]\d$/.test(k)) return;   // 미팅·방문 자리는 책상 없음
    const big = k === 'me';
    box(big ? 2.6 : 1.6, .08, big ? 1.1 : .8, big ? 0x6b4226 : 0xb9895a, x, .82, z + .75);
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sz]) => box(.07, .78, .07, 0x3b3f46, x + sx * (big ? 1.2 : .7), .43, z + .75 + sz * (big ? .45 : .3)));
    if (!big) {
      box(.08, .5, .08, 0x23272e, x + .35, 1.1, z + .95);
      box(.75, .48, .05, 0x23272e, x + .35, 1.42, z + .95);
      const face = new THREE.Mesh(new THREE.PlaneGeometry(.66, .4), mat(0x1c2a38, { emissive: 0x000000 })); face.position.set(x + .35, 1.42, z + .92); face.rotation.y = Math.PI; scene.add(face);
      roomFx[room].screens.push(face);
      box(.5, .03, .2, 0xdddddd, x - .2, .88, z + .6);
    } else {
      box(.5, .3, .35, 0x2f5d8a, x + .7, 1.0, z + .75); // 노트북
    }
    box(.55, .08, .55, 0x3b3f46, x, .5, z - .15); box(.55, .6, .08, 0x3b3f46, x, .82, z - .42); // 의자
  });
  const tb = new THREE.Mesh(new THREE.CylinderGeometry(1.4, 1.4, .1, 32), mat(0xc9a77d)); tb.position.set(0, .8, -3); tb.castShadow = tb.receiveShadow = true; scene.add(tb);
  box(.15, .75, .15, 0x3b3f46, 0, .4, -3);
  box(3.2, 1.6, .06, 0xffffff, 0, 1.6, -8.75); // 화이트보드
  [[-14.3, -8.4], [14.3, -8.4], [-4.3, 8.4], [14.3, 8.4]].forEach(([x, z]) => { const p = new THREE.Mesh(new THREE.ConeGeometry(.4, 1, 10), mat(0x2f8f5b)); p.position.set(x, .9, z); p.castShadow = true; scene.add(p); box(.5, .4, .5, 0x9a6b45, x, .26, z); });
}

function makeMini(color, hair, crown) {
  const g = new THREE.Group();
  const skin = mat(0xffd9b8), dark = mat(0x2a2d33), body = mat(color);
  const legL = new THREE.Mesh(new THREE.CylinderGeometry(.09, .09, .45, 10), dark); legL.geometry.translate(0, -.22, 0); legL.position.set(-.12, .45, 0);
  const legR = legL.clone(); legR.position.x = .12;
  const torso = new THREE.Mesh(new THREE.CylinderGeometry(.24, .3, .55, 16), body); torso.position.y = .72;
  const armL = new THREE.Mesh(new THREE.CylinderGeometry(.07, .07, .42, 8), body); armL.geometry.translate(0, -.18, 0); armL.position.set(-.34, .95, 0);
  const armR = armL.clone(); armR.position.x = .34;
  const head = new THREE.Mesh(new THREE.SphereGeometry(.42, 24, 18), skin); head.position.y = 1.35;
  const hairM = new THREE.Mesh(new THREE.SphereGeometry(.44, 24, 18, 0, Math.PI * 2, 0, Math.PI * .5), mat(hair)); hairM.position.y = 1.4; hairM.rotation.x = -.3;
  const eyeG = new THREE.SphereGeometry(.05, 10, 8), eyeM = mat(0x111111);
  const eyeL = new THREE.Mesh(eyeG, eyeM); eyeL.position.set(-.14, 1.34, .39); const eyeR = eyeL.clone(); eyeR.position.x = .14;
  const cheek = mat(0xff9a9a); const ch1 = new THREE.Mesh(new THREE.SphereGeometry(.05, 8, 6), cheek); ch1.position.set(-.25, 1.24, .33); const ch2 = ch1.clone(); ch2.position.x = .25;
  [legL, legR, torso, armL, armR, head, hairM, eyeL, eyeR, ch1, ch2].forEach(m => { m.castShadow = true; g.add(m); });
  if (crown) {
    const gold = mat(0xf4c430, { metalness: .5, roughness: .3, side: THREE.DoubleSide });
    const c = new THREE.Mesh(new THREE.CylinderGeometry(.26, .3, .16, 12, 1, true), gold); c.position.y = 1.86; g.add(c);
    for (let i = 0; i < 5; i++) { const sp = new THREE.Mesh(new THREE.ConeGeometry(.06, .16, 6), gold); const a = i / 5 * Math.PI * 2; sp.position.set(Math.cos(a) * .27, 2.0, Math.sin(a) * .27); g.add(sp); }
  }
  g.userData = { legL, legR, armL, armR, head };
  scene.add(g);
  return g;
}

function initThree() {
  if (!three) { stage.insertAdjacentHTML('beforeend', '<div class="nogl">3D를 그리는 라이브러리를 불러오지 못했어요.<br>인터넷 연결을 확인하고 새로고침해 주세요.</div>'); return; }
  try { renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); }
  catch (e) { three = false; stage.insertAdjacentHTML('beforeend', '<div class="nogl">이 브라우저에서는 3D를 그릴 수 없어요(WebGL 꺼짐).</div>'); return; }
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.prepend(renderer.domElement);
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(38, 1, .1, 200);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x6b6458, .55));
  const sun = new THREE.DirectionalLight(0xfff4e0, .75); sun.position.set(-12, 22, 14); sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -22, right: 22, top: 16, bottom: -16, near: 1, far: 60 }); scene.add(sun);
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.maxPolarAngle = Math.PI * .44; controls.minDistance = 12; controls.maxDistance = 70;
  clock = new THREE.Clock();
  buildOffice();
  TEAM.forEach(([k, n, , col, hair]) => addMini(k, n, makeMini(col, hair, false), SEATS[k]));
  addMini('me', '주인님', makeMini(0x6b3fa0, 0x1d1d1d, true), SEATS.me);
  resize(); setView('reset'); addEventListener('resize', resize);
  renderer.setAnimationLoop(tick);
}
function addMini(k, name, obj, seat) {
  obj.position.set(seat[0], .12, seat[1]); obj.rotation.y = seat[3];
  const tag = document.createElement('div'); tag.className = 'lbl'; tag.innerHTML = `<div class="say" hidden></div><div class="nm">${name}</div>`;
  labels.appendChild(tag);
  minis[k] = { obj, tag, say: tag.querySelector('.say'), path: [], seat: k, mode: '', face: seat[3], room: seat[2] };
}
function setView(v) {
  if (!camera) return;
  const narrow = stage.clientWidth < 640;
  if (v === 'top') camera.position.set(0, 50, 4); else camera.position.set(0, narrow ? 40 : 21, narrow ? 44 : 23);
  controls.target.set(0, 0, .5); controls.update();
}
function resize() { if (!renderer) return; const w = stage.clientWidth, h = stage.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); }

function goTo(k, seatId) {
  const m = minis[k]; if (!m || m.seat === seatId) return;
  const s = SEATS[seatId];
  const pts = route(m.room, s[2]).map(([x, z]) => new THREE.Vector3(x, .12, z));
  pts.push(new THREE.Vector3(s[0], .12, s[1]));
  if (REDUCED) { m.obj.position.copy(pts[pts.length - 1]); m.path = []; } else m.path = pts;
  m.seat = seatId; m.room = s[2]; m.face = s[3];
}
function tick() {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  Object.values(minis).forEach(m => {
    const o = m.obj, u = o.userData;
    o.scale.y = 1;
    if (m.path.length) {
      const target = m.path[0], dx = target.x - o.position.x, dz = target.z - o.position.z, dist = Math.hypot(dx, dz), step = 3.2 * dt;
      o.rotation.y = Math.atan2(dx, dz);
      if (dist <= step) { o.position.x = target.x; o.position.z = target.z; m.path.shift(); } else { o.position.x += dx / dist * step; o.position.z += dz / dist * step; }
      const sw = Math.sin(t * 12) * .6; u.legL.rotation.x = sw; u.legR.rotation.x = -sw; u.armL.rotation.x = -sw * .8; u.armR.rotation.x = sw * .8; u.head.rotation.x = 0;
      o.position.y = .12 + Math.abs(Math.sin(t * 12)) * .06;
    } else {
      let d = m.face - o.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d)); o.rotation.y += d * Math.min(1, dt * 6);
      u.legL.rotation.x = u.legR.rotation.x = 0; o.position.y = .12;
      if (m.mode === 'work') { u.armL.rotation.x = -1.1 + Math.sin(t * 14) * .2; u.armR.rotation.x = -1.1 - Math.sin(t * 14) * .2; u.head.rotation.x = .15 + Math.sin(t * 3) * .04; }
      else if (m.mode === 'alert') { u.armR.rotation.x = Math.PI - .3 + Math.sin(t * 8) * .25; u.armL.rotation.x = 0; u.head.rotation.x = -.1; o.position.y = .12 + Math.abs(Math.sin(t * 6)) * .05; }
      else { u.armL.rotation.x = u.armR.rotation.x = 0; u.head.rotation.x = 0; o.scale.y = 1 + Math.sin(t * 2 + o.position.x) * .015; }
    }
  });
  Object.values(roomFx).forEach(f => { if (f.alert) { const on = REDUCED || Math.sin(t * 7) > 0; f.beacon.material.emissive.setHex(on ? 0xff2010 : 0x220000); f.light.intensity = on ? 1.4 : .2; } });
  controls.update();
  renderer.render(scene, camera);
  const w = stage.clientWidth, h = stage.clientHeight, v = new THREE.Vector3();
  const put = (el, x, y, z) => { v.set(x, y, z).project(camera); el.style.display = v.z < 1 ? '' : 'none';
    el.style.transform = `translate(${(v.x * .5 + .5) * w}px, ${(-v.y * .5 + .5) * h}px) translate(-50%, -100%)`; };
  Object.values(minis).forEach(m => put(m.tag, m.obj.position.x, m.obj.position.y + 2.15, m.obj.position.z));
  Object.values(roomLbl).forEach(r => put(r.el, r.pos.x, r.pos.y, r.pos.z));
}

// ---------- 상태 → 화면 ----------
const ACK_KEY = 'ai-office-ack';
const acks = (() => { try { return JSON.parse(localStorage.getItem(ACK_KEY) || '{}'); } catch (e) { return {}; } })();
function ack(id) { acks[id] = 1; try { localStorage.setItem(ACK_KEY, JSON.stringify(acks)); } catch (e) {} if (window._D) render(window._D); }
const age = iso => (Date.now() - new Date(iso).getTime()) / 1000;

function render(D) {
  window._D = D;
  const M = D.members || {}, C = D.counts || {}, live = D.live || null;
  const on = D.production === 'running' || (live && live.phase !== 'idle');
  document.getElementById('hstats').innerHTML = `
    <span class="power"><span class="dot" style="background:var(${on ? '--ok' : '--warn'})"></span>${on ? '제작 중' : '쉬는 중'}</span>
    <span><b>${C.published ?? '-'}</b>편 발행</span><span><b>${C.made_today ?? 0}</b>편 오늘 제작</span>
    <span>다음 차례 <b style="font-size:16px">${C.next_track === 'chart' ? '차트' : '생활'}</b></span>
    <span style="font-family:var(--mono);font-size:12px">갱신 ${fmt(D.updated_at)}</span>`;

  const pos = {};
  const blocked = ORDER.filter(k => M[k]?.state === 'blocked' && !acks[k + '|' + M[k].at]);
  blocked.slice(0, 2).forEach((k, i) => pos[k] = { seat: ['v1', 'v2'][i], say: '주인님, 보고드립니다!', mode: 'alert', alert: true });
  const R = D.result, resId = R ? 'result|' + (R.slug || '') : '';
  if (R && !acks[resId] && !pos.deploy && blocked.length < 2) pos.deploy = { seat: blocked.length ? 'v2' : 'v1', say: '완성했어요! 확인해 주세요', mode: '' };
  for (let i = 0; i < ORDER.length - 1; i++) {
    const a = ORDER[i], b = ORDER[i + 1];
    if (M[a]?.state === 'done' && M[b]?.state === 'working' && age(M[a].at) < 180 && !pos[a] && !pos[b]) {
      pos[a] = { seat: 'm1', say: '자료 넘겨요', mode: '' }; pos[b] = { seat: 'm2', say: '받았어요!', mode: '' }; break;
    }
  }
  ORDER.forEach(k => { if (!pos[k]) pos[k] = { seat: k, say: '', mode: M[k]?.state === 'working' ? 'work' : '' }; });
  if (scene) {
    ORDER.forEach(k => { const m = minis[k], p = pos[k]; goTo(k, p.seat); m.mode = p.mode; m.say.hidden = !p.say; m.say.textContent = p.say; m.say.classList.toggle('alert', !!p.alert); });
    Object.entries(roomFx).forEach(([room, f]) => {
      const who = TEAM.filter(t => t[2] === room).map(t => t[0]);
      const busy = who.some(k => M[k]?.state === 'working'), alert = who.some(k => M[k]?.state === 'blocked');
      f.alert = alert;
      if (!alert) { f.beacon.material.emissive.setHex(0); f.light.color.setHex(0xffc860); f.light.intensity = busy ? .6 : 0; } else f.light.color.setHex(0xff3020);
      f.floor.material.color.setHex(alert ? 0xe8a59c : busy ? 0xf0cf78 : ROOMS[room].floor);
      f.screens.forEach(s => s.material.emissive.setHex(busy ? 0x6fb4ff : 0x000000));
      if (who.length) { const st = who.map(k => M[k]?.state);
        const lab = st.includes('blocked') ? '<i class="b">막힘</i>' : st.includes('working') ? '<i class="w">일하는 중</i>' : st.every(s => s === 'done') ? '<i class="d">완료</i>' : '';
        roomLbl[room].el.innerHTML = esc(ROOMS[room].name) + lab; }
    });
    scene.background = new THREE.Color(css('--panel') || '#f4efe4');
  }

  document.getElementById('alarms').innerHTML = (live && live.quiet_sec >= 240 ? `<div class="alarm" role="status" style="background:var(--warn)"><span class="siren"></span>
    <div class="msg">${Math.floor(live.quiet_sec / 60)}분째 새 진행이 없어요 <span>· 무언가를 기다리는 중일 수 있어요. 10분 넘게 그대로면 [멈춤] 후 다시 시작해 주세요.</span></div></div>` : '') +
    blocked.map(k => `<div class="alarm" role="alert"><span class="siren"></span><div class="msg">${NAME[k]} 막힘 <span>· ${esc(M[k].task)} (${fmt(M[k].at)})</span></div>
    <button type="button" data-ack="${esc(k + '|' + M[k].at)}">확인했어요</button></div>`).join('');
  document.getElementById('todo').innerHTML = (D.todo || []).map(t => `<li>${esc(t)}</li>`).join('') || '<li>할 일이 없어요</li>';
  let inbox = blocked.map(k => `<div class="report"><b>${NAME[k]}의 보고 · ${fmt(M[k].at)}</b>${esc(M[k].task)}
    <div class="row">${live ? '<button class="btn small primary" type="button" data-retry="1">다시 시도</button>' : ''}<button class="btn small" type="button" data-ack="${esc(k + '|' + M[k].at)}">확인</button></div></div>`).join('');
  if (R && !acks[resId]) inbox += `<div class="report good"><b>배포의 완성 보고</b>${esc(R.title || R.slug)}<div class="row"><button class="btn small" type="button" data-ack="${esc(resId)}">확인</button></div></div>`;
  document.getElementById('inbox').innerHTML = inbox;
  document.getElementById('team').innerHTML = TEAM.map(([k, n, , col]) => { const m = M[k] || { state: 'idle', task: '' };
    return `<li><span class="sw" style="background:#${col.toString(16).padStart(6, '0')}"></span><b>${n}</b><span class="tag" data-s="${m.state}">${S[m.state]}</span><span class="t" title="${esc(m.task)}">${esc(m.task)}</span></li>`; }).join('');
  document.getElementById('log').innerHTML = (D.log || []).slice(0, 8).map(l => `<li><time>${fmt(l.at)}</time><span><b>${NAME[l.who] || esc(l.who)}</b> ${esc(l.msg)}</span></li>`).join('');
  document.querySelectorAll('[data-ack]').forEach(b => b.onclick = () => ack(b.dataset.ack));
  document.querySelectorAll('[data-retry]').forEach(b => b.onclick = openStart);
  if (live) renderLive(D);
}

const PH = { idle: '쉬는 중', produce: '제작 중', upload: '업로드 중' };
function renderLive(D) {
  const L = D.live;
  document.body.classList.add('live');
  const busy = L.phase !== 'idle', left = Math.max(0, L.limit - L.today);
  document.getElementById('ctlState').textContent = busy ? `${PH[L.phase]} · ${L.topic || '기획팀이 주제 고르는 중'} (${L.machine})`
    : (!L.claude ? 'Claude Code가 설치되어 있지 않아요 (office/SETUP.md)' : `오늘 ${L.today}편 · ${left}편 더 만들 수 있어요 · ${L.machine}`);
  document.getElementById('openStart').disabled = busy || !L.claude || left === 0;
  document.getElementById('btnUpload').disabled = busy;
  document.getElementById('btnStop').disabled = !busy;
  const feed = document.getElementById('feed'), atBottom = feed.scrollTop + feed.clientHeight >= feed.scrollHeight - 20;
  feed.textContent = (L.lines || []).join('\n') || '아직 기록이 없어요. [기획 시작]을 누르면 진행 상황이 여기에 나와요.';
  if (atBottom) feed.scrollTop = feed.scrollHeight;
  const R = D.result, rc = document.getElementById('resultCard');
  rc.hidden = !R;
  if (R) {
    document.getElementById('result').innerHTML = `<div style="font-weight:700">${esc(R.title || R.slug)}</div>
      <div style="font-family:var(--mono);font-size:11.5px;color:var(--soft)">${esc(R.slug)} · 네이버 묶음: ${esc(R.naver || '없음')}</div>
      ${R.threads_text ? `<div class="copybox" id="thr">${esc(R.threads_text)}</div><button class="btn" type="button" id="copyThr">쓰레드 문구 복사</button>` : ''}`;
    const cb = document.getElementById('copyThr');
    if (cb) cb.onclick = () => navigator.clipboard.writeText(R.threads_text).then(() => cb.textContent = '복사했어요',
      () => { const r = document.createRange(); r.selectNodeContents(document.getElementById('thr')); getSelection().removeAllRanges(); getSelection().addRange(r); });
  }
}
function openStart() {
  if (!window._D?.live || document.getElementById('openStart').disabled) return;
  document.getElementById('startErr').textContent = '';
  document.getElementById('startDlg').showModal();
  document.getElementById('topic').focus();
}
async function post(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `실패 (${r.status})`);
  return j;
}
async function poll() { try { const r = await fetch('/api/status', { cache: 'no-store' }); if (r.ok) render(await r.json()); } catch (e) {} }
function pickRoom(ev) {   // 기획팀 방 바닥을 누르면 시작
  if (!scene || !window._D?.live) return;
  const rect = renderer.domElement.getBoundingClientRect();
  const ray = new THREE.Raycaster(); ray.setFromCamera({ x: (ev.clientX - rect.left) / rect.width * 2 - 1, y: -(ev.clientY - rect.top) / rect.height * 2 + 1 }, camera);
  if (ray.intersectObject(roomFx.plan.floor).length) openStart();
}

initThree();
const D0 = JSON.parse(document.getElementById('data').textContent);
render(D0);
document.getElementById('viewTop').onclick = () => setView('top');
document.getElementById('viewReset').onclick = () => setView('reset');
if (D0.live && location.protocol.startsWith('http')) {
  document.getElementById('hint').textContent = '끌어서 돌리기 · 휠로 확대 · 기획팀 방을 누르면 시작';
  let down = null;
  stage.addEventListener('pointerdown', e => down = [e.clientX, e.clientY]);
  stage.addEventListener('pointerup', e => { if (down && Math.hypot(e.clientX - down[0], e.clientY - down[1]) < 5) pickRoom(e); down = null; });
  document.getElementById('openStart').onclick = openStart;
  document.getElementById('startGo').onclick = async () => {
    try { await post('/api/start', { topic: document.getElementById('topic').value }); document.getElementById('startDlg').close(); poll(); }
    catch (e) { document.getElementById('startErr').textContent = e.message; }
  };
  document.getElementById('topic').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); document.getElementById('startGo').click(); } });
  document.getElementById('btnUpload').onclick = () => post('/api/upload').then(poll, e => alert(e.message));
  document.getElementById('btnStop').onclick = () => post('/api/stop').then(poll);
  setInterval(poll, 3000);
}
</script>
