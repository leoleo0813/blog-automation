<style>
/* Layout: 건물 단면 — 층마다 팀원 한 명, 위층에서 아래층으로 글이 내려온다. 옆 칸은 안내 데스크(요약·할 일·기록). */
:root {
  --sky: #dfe7ee;        /* 낮 하늘 */
  --facade: #c9c3b8;     /* 콘크리트 외벽 */
  --facade-edge: #a69f93;
  --room: #f6f2ea;       /* 불 꺼진 방 */
  --lit: #ffe3a3;        /* 불 켜진 방 */
  --ink: #23272e;
  --soft: #5d6470;
  --line: #d9d3c7;
  --paper: #fffdf8;
  --accent: #2f5d8a;     /* 엘리베이터·링크 */
  --ok: #1d7a4c; --ok-bg: #dcf1e5;
  --warn: #9a5b00; --warn-bg: #fdecc8;
  --bad: #b3261e; --bad-bg: #fbe0dd;
  --idle: #6b7280; --idle-bg: #e7e9ec;
  --display: 'Black Han Sans', 'Noto Sans KR', system-ui, sans-serif;
  --body: 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif;
  --hand: 'Gowun Dodum', 'Noto Sans KR', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --sky: #10161f; --facade: #2b2f36; --facade-edge: #1c1f24; --room: #1a1e25; --lit: #5a4718;
  --ink: #eef0f3; --soft: #a3aab5; --line: #343a43; --paper: #161a20; --accent: #7fb0e0;
  --ok: #6fd3a0; --ok-bg: #173527; --warn: #f2c16b; --warn-bg: #3a2c10; --bad: #ff8a80; --bad-bg: #3d1a18;
  --idle: #9aa1ab; --idle-bg: #262b32; color-scheme: dark } }
:root[data-theme="dark"] {
  --sky: #10161f; --facade: #2b2f36; --facade-edge: #1c1f24; --room: #1a1e25; --lit: #5a4718;
  --ink: #eef0f3; --soft: #a3aab5; --line: #343a43; --paper: #161a20; --accent: #7fb0e0;
  --ok: #6fd3a0; --ok-bg: #173527; --warn: #f2c16b; --warn-bg: #3a2c10; --bad: #ff8a80; --bad-bg: #3d1a18;
  --idle: #9aa1ab; --idle-bg: #262b32; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--sky); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55 }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; margin-bottom: 22px }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(34px, 6vw, 52px); line-height: 1; margin: 0; letter-spacing: .01em }
h1 small { display: block; font-family: var(--body); font-size: 15px; font-weight: 500; color: var(--soft); margin-top: 8px; letter-spacing: 0 }
.power { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; background: var(--paper); border: 1px solid var(--line) }
.power b { font-weight: 700 }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none }
.updated { font-family: var(--mono); font-size: 12px; color: var(--soft) }

.grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 24px; align-items: start }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0, 1fr) } }

/* 건물 */
.tower { position: relative; background: var(--facade); border: 3px solid var(--facade-edge); border-bottom: 0;
  border-radius: 6px 6px 0 0; padding: 14px 14px 0 64px }
.roof { position: absolute; left: 50%; top: -34px; transform: translateX(-50%); font-family: var(--display); font-size: 16px;
  background: var(--ink); color: var(--paper); padding: 6px 16px; border-radius: 6px 6px 0 0; letter-spacing: .08em; white-space: nowrap }
.shaft { position: absolute; left: 18px; top: 14px; bottom: 0; width: 30px; background: var(--facade-edge); border-radius: 4px 4px 0 0 }
.car { position: absolute; left: 3px; width: 24px; height: 34px; border-radius: 3px; background: var(--accent); transition: top .6s ease }
.car::after { content: ""; position: absolute; left: 11px; top: 4px; bottom: 4px; width: 2px; background: var(--paper); opacity: .6 }
.floor { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; align-items: stretch; margin-bottom: 12px }
.fl { font-family: var(--display); font-size: 22px; color: var(--paper); background: var(--ink); border-radius: 6px;
  display: grid; place-items: center; line-height: 1 }
.room { position: relative; display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 14px; align-items: center;

.room[data-state="working"] { background: var(--lit) }
.room[data-state="blocked"] { border-color: var(--bad) }
.room svg { width: 96px; height: 84px; display: block }
.who { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px }
.who h2 { font-size: 17px; margin: 0; font-weight: 700 }
.who .job { font-size: 12.5px; color: var(--soft) }
.pill { font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; display: inline-flex; align-items: center; gap: 5px }
.pill[data-s="idle"] { color: var(--idle); background: var(--idle-bg) }
.pill[data-s="working"] { color: var(--warn); background: var(--warn-bg) }
.pill[data-s="done"] { color: var(--ok); background: var(--ok-bg) }
.pill[data-s="blocked"] { color: var(--bad); background: var(--bad-bg) }
.bubble { font-family: var(--hand); font-size: 15.5px; margin-top: 6px; line-height: 1.45 }
.when { font-family: var(--mono); font-size: 11.5px; color: var(--soft); margin-top: 3px }
.lobby { background: var(--ink); color: var(--paper); border-radius: 0; margin: 0 -14px 0 -64px; padding: 14px 14px 16px 78px; display: grid;
  grid-template-columns: 52px minmax(0, 1fr); gap: 10px }
.lobby .fl { background: var(--paper); color: var(--ink); font-size: 16px }
.lobby .room { background: transparent; color: var(--paper); padding-left: 0 }
.lobby .who .job, .lobby .when { color: var(--paper); opacity: .7 }
.ground { height: 12px; background: var(--facade-edge) }

/* 안내 데스크 */
.desk { display: grid; gap: 16px }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px }
.card h3 { margin: 0 0 12px; font-size: 13px; letter-spacing: .08em; color: var(--soft); font-weight: 700 }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px }
.stat b { display: block; font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1.1; font-variant-numeric: tabular-nums }
.stat span { font-size: 12.5px; color: var(--soft) }
.sched { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line); font-size: 13.5px }
.sched dt { color: var(--soft) } .sched dd { margin: 0; font-family: var(--mono); font-size: 13px }
ol.todo { margin: 0; padding-left: 20px; display: grid; gap: 8px } ol.todo li { padding-left: 2px }
.posts, .log { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px }
.posts li { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; font-size: 13.5px }
.posts .id { font-family: var(--mono); color: var(--soft); font-size: 12.5px }
.posts .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.tag { font-size: 11px; padding: 1px 7px; border-radius: 4px; background: var(--idle-bg); color: var(--soft) }
.log li { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; font-size: 13.5px }
.log time { font-family: var(--mono); font-size: 12px; color: var(--soft) }
.log b { font-weight: 700 }
.note { font-size: 12.5px; color: var(--soft); margin-top: 10px }

@media (prefers-reduced-motion: no-preference) {
  .room[data-state="working"] .lamp { animation: glow 1.6s ease-in-out infinite }
  .room[data-state="working"] .arm { animation: type .5s ease-in-out infinite alternate; transform-origin: 50% 0 }
}
@keyframes glow { 50% { opacity: .35 } }
@keyframes type { to { transform: translateY(2px) } }
@media (max-width: 480px) {
  .tower { padding-left: 14px } .shaft { display: none } .lobby { margin-left: -14px; padding-left: 14px }
  .room { grid-template-columns: 70px minmax(0, 1fr); gap: 10px } .room svg { width: 70px; height: 62px }
  .floor, .lobby { grid-template-columns: 40px minmax(0, 1fr) } .fl { font-size: 18px }
}
</style>

    ${human ? '' : '<path d="M42 14v-6" stroke="var(--ink)" stroke-width="2"/><circle cx="42" cy="7" r="2.5" fill="var(--ink)"/>'}
    <circle cx="38" cy="25" r="2" fill="var(--ink)"/><circle cx="46" cy="25" r="2" fill="var(--ink)"/>
    <path class="arm" d="M50 52l10 8" stroke="${body}" stroke-width="6" stroke-linecap="round"/>
    ${PROP[role]}
    <path d="M10 68h80" stroke="var(--ink)" stroke-width="3"/><path d="M18 68v14M82 68v14" stroke="var(--ink)" stroke-width="3"/>
  </svg>`;
}
function room([key, fl, name, job], human) {
  const m = D.members[key] || { state: 'idle', task: '' };
  return `<div class="fl">${fl}</div>
    <div class="room" data-state="${m.state}">
      ${figure(key, human)}
      <div style="min-width:0">
        <div class="who"><h2>${name}</h2><span class="pill" data-s="${m.state}">${S[m.state]}</span><span class="job">${job}</span></div>
        <div class="bubble">${esc(m.task)}</div>
        <div class="when">${fmt(m.at)}</div>
      </div>
    </div>`;
}
document.getElementById('floors').innerHTML = ROLES.map(r => `<div class="floor" data-role="${r[0]}">${room(r)}</div>`).join('');
document.getElementById('lobby').innerHTML = room(HUMAN, true);

// 엘리베이터: 일하는 중이거나 막힌 층에 멈춤
const act = ROLES.find(r => D.members[r[0]]?.state === 'working') || ROLES.find(r => D.members[r[0]]?.state === 'blocked');
const place = () => { const car = document.getElementById('car'); const el = act && document.querySelector(`[data-role="${act[0]}"]`);
  car.style.top = el ? `${el.offsetTop - 14 + el.offsetHeight / 2 - 17}px` : '0px'; };
place(); addEventListener('resize', place);

const on = D.production === 'running';
document.getElementById('power').innerHTML = `<span class="dot" style="background:var(${on ? '--ok' : '--warn'})"></span>
  <div><b>${on ? '자동 제작 켜짐' : '자동 제작 멈춤'}</b><div style="font-size:12.5px;color:var(--soft)">${esc(D.production_note || '')}</div></div>`;
document.getElementById('updated').textContent = `갱신 ${fmt(D.updated_at)} (한국 시간)`;

const C = D.counts;
document.getElementById('stats').innerHTML = [
  [C.published, '발행 완료'], [C.waiting_upload, '업로드 대기'], [C.last.id, '마지막 편 번호'],
].map(([n, l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');
document.getElementById('sched').innerHTML = `
  <dt>제작</dt><dd>매일 ${D.schedule.make.join(' · ')}</dd>
  <dt>업로드</dt><dd>매일 ${D.schedule.upload.join(' · ')}</dd>
  <dt>다음 차례</dt><dd>${C.next_track === 'life' ? '생활정보' : '차트·지표'}</dd>`;
document.getElementById('todo').innerHTML = D.todo.map(t => `<li>${esc(t)}</li>`).join('');
document.getElementById('posts').innerHTML = C.recent.map(p => `<li><span class="id">${p.id}</span>
  <span class="t" title="${esc(p.title)}">${esc(p.title)}</span><span class="tag">${p.track === 'life' ? '생활' : '차트'}</span></li>`).join('');
document.getElementById('log').innerHTML = D.log.slice(0, 8).map(l => `<li><time>${fmt(l.at)}</time>
  <span><b>${NAME[l.who] || l.who}</b> ${esc(l.msg)}</span></li>`).join('');
})();
</script>
