<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
<rect width="1200" height="560" fill="#ffffff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="60" y="70" font-size="34" font-weight="bold" fill="#111">배당락일 평균 주가 하락폭, 코스피가 코스닥의 약 4배</text>
<text x="60" y="112" font-size="24" fill="#666">12월 말 배당기준일 기업 기준, 단위 bp (100bp = 1%)</text>
<text x="60" y="215" font-size="28" fill="#222">코스피</text>
<rect x="210" y="175" width="856" height="64" rx="6" fill="#1a2744"/>
<text x="1086" y="219" font-size="28" font-weight="bold" fill="#1a2744">42.8bp</text>
<text x="60" y="335" font-size="28" fill="#222">코스닥</text>
<rect x="210" y="295" width="214" height="64" rx="6" fill="#e67e22"/>
<text x="444" y="339" font-size="28" font-weight="bold" fill="#e67e22">10.7bp</text>
<text x="60" y="440" font-size="25" fill="#333">42.8bp는 약 0.43%입니다. 1만 원짜리 주식이면 평균 43원 정도입니다.</text>
<text x="60" y="525" font-size="21" fill="#888">자료: 자본시장연구원 발간물(본문 인용). 연구 통계이며 종목별 하락폭은 다릅니다</text>
</g>
</svg>
