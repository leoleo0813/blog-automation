<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="#ffffff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="60" y="66" font-size="38" font-weight="bold" fill="#111">올해 연금계좌 세액공제 일정</text>
<text x="60" y="108" font-size="25" fill="#666">12월 31일까지 넣은 돈이 올해 공제 대상</text>
<line x1="100" y1="300" x2="1100" y2="300" stroke="#444" stroke-width="5"/>
<rect x="150" y="262" width="450" height="76" fill="#dbeafe" stroke="#4a90d9" stroke-width="3"/>
<text x="375" y="311" font-size="30" font-weight="bold" fill="#1a2744" text-anchor="middle">남은 77일</text>
<circle cx="150" cy="300" r="16" fill="#4a90d9"/>
<circle cx="600" cy="300" r="22" fill="#c0392b"/>
<circle cx="850" cy="300" r="16" fill="#4a90d9"/>
<circle cx="1060" cy="300" r="16" fill="#4a90d9"/>
<text x="150" y="215" font-size="30" font-weight="bold" fill="#1a2744" text-anchor="middle">10월 15일</text>
<text x="150" y="255" font-size="24" fill="#555" text-anchor="middle">이 글 기준일</text>
<text x="600" y="215" font-size="30" font-weight="bold" fill="#c0392b" text-anchor="middle">12월 31일</text>
<text x="600" y="255" font-size="24" fill="#c0392b" text-anchor="middle">납입 마감</text>
<text x="850" y="215" font-size="30" font-weight="bold" fill="#1a2744" text-anchor="middle">2027년 초</text>
<text x="850" y="255" font-size="24" fill="#555" text-anchor="middle">연말정산</text>
<text x="1060" y="215" font-size="30" font-weight="bold" fill="#1a2744" text-anchor="middle">2027년 5월</text>
<text x="1060" y="255" font-size="24" fill="#555" text-anchor="middle">종합소득세 신고</text>
<rect x="80" y="420" width="1040" height="230" rx="14" fill="#f6f6f4" stroke="#bbb" stroke-width="2"/>
<text x="110" y="475" font-size="30" font-weight="bold" fill="#1a2744">남은 공제 여지 = 900만원 - 올해 이미 넣은 금액</text>
<text x="110" y="530" font-size="28" fill="#333">예: 300만원 넣었다면 600만원 더 (환급 최대 99만원)</text>
<text x="110" y="580" font-size="28" fill="#333">예: 600만원 넣었다면 300만원 더 (환급 최대 49.5만원)</text>
<text x="110" y="630" font-size="24" fill="#666">환급 최대액은 총급여 5,500만원 이하(16.5%) 기준</text>
</g>
</svg>
