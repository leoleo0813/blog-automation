<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<rect width="1200" height="700" fill="#ffffff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="70" y="78" font-size="36" font-weight="bold" fill="#111">충당금을 빼고 보면 영업이익은 얼마였나</text>
<text x="70" y="122" font-size="25" fill="#666">메타 2026년 3분기 영업이익, 합의금 충당금 반영 전후 · 십억 달러</text>
<text x="70" y="190" font-size="27" font-weight="bold" fill="#222">공시된 영업이익</text>
<rect x="70" y="206" width="494" height="56" fill="#2f6fd0"/><text x="580" y="246" font-size="30" font-weight="bold" fill="#2f6fd0">12.99십억</text>
<text x="70" y="326" font-size="27" font-weight="bold" fill="#222">청소년 소송 합의 충당금(일회성)</text>
<rect x="70" y="342" width="376" height="56" fill="#d9822b"/><text x="462" y="382" font-size="30" font-weight="bold" fill="#b8651a">9.89십억</text>
<text x="70" y="462" font-size="27" font-weight="bold" fill="#222">충당금을 더한 값(계산)</text>
<rect x="70" y="478" width="869" height="56" fill="#9bb4d6"/><text x="955" y="518" font-size="30" font-weight="bold" fill="#333">22.88십억</text>
<text x="70" y="600" font-size="26" fill="#333">영업이익률 20.1% (공시값) → 35.4% (충당금 더한 계산값)</text>
<text x="70" y="660" font-size="23" fill="#666">매출 64.60십억 달러 기준 · 자료: 메타 3분기 실적 보도, 2026-10-24 확인</text>
</g></svg>
