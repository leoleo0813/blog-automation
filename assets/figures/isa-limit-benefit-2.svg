<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<rect width="1200" height="700" fill="#ffffff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="50" y="66" font-size="38" font-weight="bold" fill="#111">생산적금융 ISA 신설안 일정</text>
<text x="50" y="108" font-size="25" fill="#666">빨간 칸이 지금 단계입니다 (2026-10-15 기준)</text>
<rect x="50" y="230" width="200" height="190" rx="14" fill="#f6faf8" stroke="#3d8f6b" stroke-width="4"/><text x="150" y="276" font-size="25" font-weight="bold" fill="#3d8f6b" text-anchor="middle">2026-09-01</text><text x="150" y="334" font-size="30" font-weight="bold" fill="#111" text-anchor="middle">국무회의</text><text x="150" y="382" font-size="24" fill="#555" text-anchor="middle">정부안 확정</text><text x="260" y="340" font-size="36" fill="#999" text-anchor="middle">›</text><rect x="270" y="230" width="200" height="190" rx="14" fill="#f6faf8" stroke="#3d8f6b" stroke-width="4"/><text x="370" y="276" font-size="25" font-weight="bold" fill="#3d8f6b" text-anchor="middle">2026-09-03</text><text x="370" y="334" font-size="30" font-weight="bold" fill="#111" text-anchor="middle">국회 제출</text><text x="370" y="382" font-size="24" fill="#555" text-anchor="middle">세제개편안</text><text x="480" y="340" font-size="36" fill="#999" text-anchor="middle">›</text><rect x="490" y="230" width="200" height="190" rx="14" fill="#f6faf8" stroke="#d9534f" stroke-width="4"/><text x="590" y="276" font-size="25" font-weight="bold" fill="#d9534f" text-anchor="middle">연말까지</text><text x="590" y="334" font-size="30" font-weight="bold" fill="#111" text-anchor="middle">정기국회</text><text x="590" y="382" font-size="24" fill="#555" text-anchor="middle">심의·통과 여부</text><text x="700" y="340" font-size="36" fill="#999" text-anchor="middle">›</text><rect x="710" y="230" width="200" height="190" rx="14" fill="#f6faf8" stroke="#3d8f6b" stroke-width="4"/><text x="810" y="276" font-size="25" font-weight="bold" fill="#3d8f6b" text-anchor="middle">2027-01-01</text><text x="810" y="334" font-size="30" font-weight="bold" fill="#111" text-anchor="middle">가입 시작</text><text x="810" y="382" font-size="24" fill="#555" text-anchor="middle">신규 가입분부터</text><text x="920" y="340" font-size="36" fill="#999" text-anchor="middle">›</text><rect x="930" y="230" width="200" height="190" rx="14" fill="#f6faf8" stroke="#3d8f6b" stroke-width="4"/><text x="1030" y="276" font-size="25" font-weight="bold" fill="#3d8f6b" text-anchor="middle">2029-12-31</text><text x="1030" y="334" font-size="30" font-weight="bold" fill="#111" text-anchor="middle">가입 기한</text><text x="1030" y="382" font-size="24" fill="#555" text-anchor="middle">특례 적용 마감</text>
<rect x="50" y="500" width="1080" height="130" rx="14" fill="#fdeaea" stroke="#d9534f" stroke-width="2"/>
<text x="90" y="552" font-size="28" fill="#333">국회 통과 전 정부안입니다. 기존 ISA 한도(연 2,000만원·총 1억원)는</text>
<text x="90" y="596" font-size="28" fill="#333">이번 개편안으로 바뀌지 않습니다.</text>
</g>
</svg>