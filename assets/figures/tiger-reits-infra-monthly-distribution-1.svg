<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="#ffffff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="70" y="78" font-size="36" font-weight="bold" fill="#111">월 33원이 1년 뒤 통장에 남는 금액</text>
<text x="70" y="122" font-size="25" fill="#666">TIGER 리츠부동산인프라 1주 기준 · 월 33원 균등 지급을 그대로 12번 받는다고 계산</text>
<rect x="70" y="190" width="240" height="190" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/>
<text x="190" y="250" font-size="28" fill="#155e75" text-anchor="middle">월 분배금</text>
<text x="190" y="315" font-size="48" font-weight="bold" fill="#0891b2" text-anchor="middle">33원</text>
<text x="190" y="355" font-size="24" fill="#555" text-anchor="middle">1주당 세전</text>
<text x="355" y="292" font-size="40" font-weight="bold" fill="#999" text-anchor="middle">×12</text>
<rect x="400" y="190" width="240" height="190" rx="14" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/>
<text x="520" y="250" font-size="28" fill="#155e75" text-anchor="middle">연 분배금</text>
<text x="520" y="315" font-size="48" font-weight="bold" fill="#0891b2" text-anchor="middle">396원</text>
<text x="520" y="355" font-size="24" fill="#555" text-anchor="middle">세전 합계</text>
<text x="685" y="292" font-size="30" font-weight="bold" fill="#999" text-anchor="middle">−15.4%</text>
<rect x="730" y="190" width="240" height="190" rx="14" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/>
<text x="850" y="250" font-size="28" fill="#991b1b" text-anchor="middle">배당소득세</text>
<text x="850" y="315" font-size="48" font-weight="bold" fill="#dc2626" text-anchor="middle">약 61원</text>
<text x="850" y="355" font-size="24" fill="#555" text-anchor="middle">396 × 0.154</text>

<rect x="400" y="440" width="400" height="170" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
<text x="600" y="500" font-size="28" fill="#166534" text-anchor="middle">세후 입금 (1주 · 1년)</text>
<text x="600" y="565" font-size="52" font-weight="bold" fill="#16a34a" text-anchor="middle">약 335원</text>
<text x="600" y="598" font-size="22" fill="#555" text-anchor="middle">100주면 연 약 33,500원</text>
<text x="70" y="680" font-size="22" fill="#888">자료: 미래에셋자산운용 2025-03 발표(월 33원 내외), 배당소득세 15.4%, 2026-10-23 기준</text>
</g></svg>
