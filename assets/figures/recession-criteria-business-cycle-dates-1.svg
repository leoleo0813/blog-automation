<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
<rect width="1200" height="640" fill="#ffffff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="70" y="78" font-size="36" font-weight="bold" fill="#111">한국 제11순환기: 확장 54개월, 수축 32개월</text>
<text x="70" y="122" font-size="25" fill="#666">통계청 기준순환일 · 2013년 3월 저점에서 2020년 5월 저점까지 86개월</text>
<rect x="70" y="260" width="665.6" height="90" fill="#cfe8d6"/>
<rect x="735.6" y="260" width="394.4" height="90" fill="#f6d5cf"/>
<text x="402.8" y="316" font-size="30" font-weight="bold" text-anchor="middle" fill="#1f6b3a">확장기 54개월</text>
<text x="932.8" y="316" font-size="30" font-weight="bold" text-anchor="middle" fill="#9a2f20">수축기 32개월</text>
<circle cx="70" cy="305" r="12" fill="#1a2744"/>
<circle cx="735.6" cy="305" r="12" fill="#1a2744"/>
<circle cx="1130.0" cy="305" r="12" fill="#1a2744"/>
<text x="70" y="400" font-size="26" text-anchor="start" fill="#111">저점</text>
<text x="70" y="436" font-size="26" text-anchor="start" fill="#555">2013년 3월</text>
<text x="735.6" y="400" font-size="26" text-anchor="middle" fill="#111">정점</text>
<text x="735.6" y="436" font-size="26" text-anchor="middle" fill="#555">2017년 9월</text>
<text x="1130.0" y="400" font-size="26" text-anchor="end" fill="#111">저점 (잠정)</text>
<text x="1130.0" y="436" font-size="26" text-anchor="end" fill="#555">2020년 5월</text>
<text x="600" y="540" font-size="28" text-anchor="middle" fill="#111">54개월 + 32개월 = 86개월</text>
<text x="600" y="590" font-size="22" text-anchor="middle" fill="#888">자료: 통계청 기준순환일 설정 발표(2023년 3월), 기준일 2026년 10월</text>
</g>
</svg>