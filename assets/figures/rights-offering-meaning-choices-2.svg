<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
<rect width="1200" height="640" fill="#ffffff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="70" y="78" font-size="36" font-weight="bold" fill="#111">주주배정 유상증자, 공시부터 신주 상장까지</text>
<text x="70" y="122" font-size="25" fill="#666">기준일을 중심으로 날짜가 정해짐 · 날짜 간격은 회사마다 다름</text>
<line x1="80" y1="380" x2="1120" y2="380" stroke="#9aa0a6" stroke-width="4"/>
<circle cx="110" cy="380" r="13" fill="#1a2744"/>
<line x1="110" y1="350" x2="110" y2="310" stroke="#1a2744" stroke-width="3"/>
<text x="110" y="202" font-size="25" font-weight="bold" text-anchor="middle" fill="#1a2744">1</text>
<text x="110" y="236" font-size="21" text-anchor="middle" fill="#333">이사회 결의</text>
<text x="110" y="266" font-size="21" text-anchor="middle" fill="#333">증자 공시</text>
<circle cx="273" cy="380" r="13" fill="#1a2744"/>
<line x1="273" y1="410" x2="273" y2="450" stroke="#1a2744" stroke-width="3"/>
<text x="273" y="486" font-size="25" font-weight="bold" text-anchor="middle" fill="#1a2744">2</text>
<text x="273" y="518" font-size="21" text-anchor="middle" fill="#333">기준일 2거래일 전</text>
<text x="273" y="548" font-size="21" text-anchor="middle" fill="#333">마지막 매수일</text>
<circle cx="437" cy="380" r="13" fill="#e67e22"/>
<line x1="437" y1="350" x2="437" y2="310" stroke="#e67e22" stroke-width="3"/>
<text x="437" y="202" font-size="25" font-weight="bold" text-anchor="middle" fill="#e67e22">3</text>
<text x="437" y="236" font-size="21" text-anchor="middle" fill="#333">권리락일</text>
<text x="437" y="266" font-size="21" text-anchor="middle" fill="#333">(기준일 전 거래일)</text>
<circle cx="600" cy="380" r="13" fill="#2e8b57"/>
<line x1="600" y1="410" x2="600" y2="450" stroke="#2e8b57" stroke-width="3"/>
<text x="600" y="486" font-size="25" font-weight="bold" text-anchor="middle" fill="#2e8b57">4</text>
<text x="600" y="518" font-size="21" text-anchor="middle" fill="#333">신주인수권증서</text>
<text x="600" y="548" font-size="21" text-anchor="middle" fill="#333">상장·거래(5일 안팎)</text>
<circle cx="763" cy="380" r="13" fill="#1a2744"/>
<line x1="763" y1="350" x2="763" y2="310" stroke="#1a2744" stroke-width="3"/>
<text x="763" y="202" font-size="25" font-weight="bold" text-anchor="middle" fill="#1a2744">5</text>
<text x="763" y="236" font-size="21" text-anchor="middle" fill="#333">구주주 청약</text>
<text x="763" y="266" font-size="21" text-anchor="middle" fill="#333">(초과청약 가능)</text>
<circle cx="927" cy="380" r="13" fill="#9aa0a6"/>
<line x1="927" y1="410" x2="927" y2="450" stroke="#9aa0a6" stroke-width="3"/>
<text x="927" y="486" font-size="25" font-weight="bold" text-anchor="middle" fill="#9aa0a6">6</text>
<text x="927" y="518" font-size="21" text-anchor="middle" fill="#333">실권주</text>
<text x="927" y="548" font-size="21" text-anchor="middle" fill="#333">일반공모</text>
<circle cx="1090" cy="380" r="13" fill="#1a2744"/>
<line x1="1090" y1="350" x2="1090" y2="310" stroke="#1a2744" stroke-width="3"/>
<text x="1090" y="202" font-size="25" font-weight="bold" text-anchor="middle" fill="#1a2744">7</text>
<text x="1090" y="236" font-size="21" text-anchor="middle" fill="#333">납입 뒤</text>
<text x="1090" y="266" font-size="21" text-anchor="middle" fill="#333">신주 상장</text>
<text x="70" y="612" font-size="21" fill="#888">자료: 본문 일정 순서(유가증권 발행 일정 일반 절차). 실제 날짜는 각 회사 증권신고서 기준</text>
</g></svg>