<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
<rect width="1200" height="640" fill="#ffffff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="70" y="78" font-size="36" font-weight="bold" fill="#111">물가가 내리는 것과 오르는 속도가 느려지는 것</text>
<text x="70" y="122" font-size="25" fill="#666">1년 뒤 물가 수준(현재=100) · 가정 예시, 실제 통계 아님</text>
<line x1="70" y1="520" x2="1130" y2="520" stroke="#999" stroke-width="2"/>
<line x1="70" y1="270" x2="1130" y2="270" stroke="#bbb" stroke-width="2" stroke-dasharray="8 8"/>
<text x="1130" y="300" font-size="24" fill="#888" text-anchor="end">기준선 100 (막대 높이는 100 기준 비례)</text>
<rect x="150" y="257.5" width="200" height="262.5" fill="#e0a43a"/>
<text x="250" y="242" font-size="34" font-weight="bold" fill="#b27a14" text-anchor="middle">105</text>
<text x="250" y="568" font-size="28" font-weight="bold" fill="#333" text-anchor="middle">인플레이션</text>
<text x="250" y="604" font-size="24" fill="#666" text-anchor="middle">물가 +5%</text>
<rect x="500" y="265" width="200" height="255" fill="#4f9a5b"/>
<text x="600" y="250" font-size="34" font-weight="bold" fill="#2f6b3a" text-anchor="middle">102</text>
<text x="600" y="568" font-size="28" font-weight="bold" fill="#333" text-anchor="middle">디스인플레이션</text>
<text x="600" y="604" font-size="24" fill="#666" text-anchor="middle">상승률 5%에서 2%로</text>
<rect x="850" y="275" width="200" height="245" fill="#d9534f"/>
<text x="950" y="260" font-size="34" font-weight="bold" fill="#b03a37" text-anchor="middle">98</text>
<text x="950" y="568" font-size="28" font-weight="bold" fill="#333" text-anchor="middle">디플레이션</text>
<text x="950" y="604" font-size="24" fill="#666" text-anchor="middle">물가 -2%</text>
</g>
</svg>
