<text x="600" y="440" font-size="24" fill="#c0392b" text-anchor="middle">(0.436%p)</text>
<text x="60" y="700" font-size="22" fill="#666">자료: SBS Biz, 핀포인트뉴스 보도(2026-10-06 서울 채권시장 마감)</text>
