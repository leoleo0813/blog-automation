<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="#ffffff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="60" y="70" font-size="38" font-weight="bold" fill="#111">국고채 3년물과 10년물 금리 (2026-10-06 마감)</text>
<text x="60" y="114" font-size="25" fill="#666">막대 높이는 3.5%를 기준선으로 확대해 그렸습니다</text>
<line x1="60" y1="600" x2="1140" y2="600" stroke="#999" stroke-width="2"/>
<rect x="200" y="360" width="300" height="240" fill="#6fa8dc"/>
<text x="350" y="340" font-size="40" font-weight="bold" fill="#1a2744" text-anchor="middle">3.933%</text>
