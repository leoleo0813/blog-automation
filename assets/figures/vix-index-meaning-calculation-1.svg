<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
<rect width="1200" height="560" fill="#ffffff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="70" y="76" font-size="36" font-weight="bold" fill="#111">2026년 10월 2일 VIX는 15.31</text>
<text x="70" y="118" font-size="25" fill="#666">현재 종가와 평소 범위, 위기 때 수준 비교 (지수 포인트)</text>
<text x="70" y="206" font-size="26" fill="#333">10/2 종가</text>
<rect x="300" y="176" width="122.5" height="46" fill="#2c3e50"/>
<text x="436" y="211" font-size="28" font-weight="bold" fill="#2c3e50">15.31</text>
<text x="70" y="286" font-size="26" fill="#333">평소 범위 상단</text>
<rect x="300" y="256" width="160" height="46" fill="#7f8c9a"/>
<text x="474" y="291" font-size="28" font-weight="bold" fill="#555">20</text>
<text x="70" y="366" font-size="26" fill="#333">불안 구간 시작</text>
<rect x="300" y="336" width="240" height="46" fill="#d98c3f"/>
<text x="554" y="371" font-size="28" font-weight="bold" fill="#b86f20">30</text>
<text x="70" y="446" font-size="26" fill="#333">2008·2020 위기</text>
<rect x="300" y="416" width="640" height="46" fill="#d9534f"/>
<text x="954" y="451" font-size="28" font-weight="bold" fill="#d9534f">80 초과</text>
<text x="70" y="520" font-size="22" fill="#666">20·30은 일반적으로 쓰는 해석 기준, 80은 위기 때 공통 확인된 하한 · 막대 길이는 수치에 비례</text>
</g></svg>
