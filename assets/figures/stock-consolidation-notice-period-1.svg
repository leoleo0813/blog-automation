<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="#ffffff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="70" y="78" font-size="36" font-weight="bold" fill="#111">5:1 주식병합 계산 예시</text>
<text x="70" y="122" font-size="25" fill="#666">103주를 갖고 있을 때 — 5로 나누어떨어지지 않는 3주는 현금으로</text>
<rect x="70" y="170" width="440" height="400" rx="14" fill="#f3f6fb" stroke="#1a2744" stroke-width="3"/>
<text x="290" y="225" font-size="32" font-weight="bold" fill="#1a2744" text-anchor="middle">병합 전</text>
<text x="290" y="300" font-size="54" font-weight="bold" fill="#111" text-anchor="middle">103주</text>
<text x="290" y="360" font-size="34" font-weight="normal" fill="#333" text-anchor="middle">× 1,000원</text>
<line x1="110" y1="395" x2="470" y2="395" stroke="#ccc" stroke-width="2"/>
<text x="290" y="450" font-size="26" font-weight="normal" fill="#666" text-anchor="middle">평가금액</text>
<text x="290" y="505" font-size="42" font-weight="bold" fill="#111" text-anchor="middle">103,000원</text>
<polygon points="540,350 610,350 610,325 660,370 610,415 610,390 540,390" fill="#e67e22"/>
<text x="600" y="300" font-size="28" font-weight="bold" fill="#e67e22" text-anchor="middle">5주 → 1주</text>
<rect x="690" y="170" width="440" height="260" rx="14" fill="#eef7f1" stroke="#2e8b57" stroke-width="3"/>
<text x="910" y="225" font-size="32" font-weight="bold" fill="#2e8b57" text-anchor="middle">병합 후 주식</text>
<text x="910" y="300" font-size="44" font-weight="bold" fill="#111" text-anchor="middle">20주 × 5,000원</text>
<text x="910" y="375" font-size="38" font-weight="bold" fill="#333" text-anchor="middle">= 100,000원</text>
<rect x="690" y="450" width="440" height="120" rx="14" fill="#fff5ea" stroke="#e67e22" stroke-width="3"/>
<text x="910" y="500" font-size="30" font-weight="bold" fill="#e67e22" text-anchor="middle">남은 3주 = 0.6주(단주)</text>
<text x="910" y="545" font-size="26" font-weight="normal" fill="#333" text-anchor="middle">→ 회사가 팔아서 현금으로 지급</text>
<text x="600" y="630" font-size="25" font-weight="normal" fill="#444" text-anchor="middle">20주 + 단주 현금 ≈ 병합 전 103,000원 (단주 매각가에 따라 조금 달라짐)</text>
<text x="70" y="692" font-size="21" fill="#888">근거: 상법 제443조(단주의 처리). 주가 1,000원은 계산용 가정값</text>
</g></svg>