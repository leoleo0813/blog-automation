<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<rect width="1200" height="700" fill="#ffffff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="70" y="78" font-size="36" font-weight="bold" fill="#111">이번 발표와 비교할 기준 두 분기</text>
<text x="70" y="122" font-size="25" fill="#666">마이크로소프트 분기 매출 · 억 달러</text>
<text x="70" y="206" font-size="27" font-weight="bold" fill="#222">2026 회계연도 3분기 (2026년 1~3월)</text>
<rect x="70" y="222" width="745" height="62" fill="#9db7e0"/><text x="830" y="266" font-size="31" font-weight="bold" fill="#2f4f7f">829</text>
