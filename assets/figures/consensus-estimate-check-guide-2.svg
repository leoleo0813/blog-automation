<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
<rect width="1200" height="640" fill="#ffffff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="60" y="70" font-size="38" font-weight="bold" fill="#111">컨센서스가 서프라이즈·쇼크 판정이 되기까지</text>
<text x="60" y="114" font-size="25" fill="#666">전망치(발표 전)에서 확정치(발표 후)까지의 순서</text>
<rect x="50" y="220" width="250" height="260" rx="14" fill="#e0f2f1" stroke="#00796b" stroke-width="3"/><text x="175" y="280" font-size="34" font-weight="bold" fill="#004d40" text-anchor="middle">① 추정</text><text x="175" y="345" font-size="25" fill="#222" text-anchor="middle">애널리스트가</text><text x="175" y="385" font-size="25" fill="#222" text-anchor="middle">각자 전망치 작성</text><text x="318" y="360" font-size="40" fill="#00796b" text-anchor="middle">▶</text><rect x="335" y="220" width="250" height="260" rx="14" fill="#e0f2f1" stroke="#00796b" stroke-width="3"/><text x="460" y="280" font-size="34" font-weight="bold" fill="#004d40" text-anchor="middle">② 집계</text><text x="460" y="345" font-size="25" fill="#222" text-anchor="middle">금융정보업체가</text><text x="460" y="385" font-size="25" fill="#222" text-anchor="middle">평균 내서 제공</text><text x="603" y="360" font-size="40" fill="#00796b" text-anchor="middle">▶</text><rect x="620" y="220" width="250" height="260" rx="14" fill="#fff3b0" stroke="#00796b" stroke-width="3"/><text x="745" y="280" font-size="34" font-weight="bold" fill="#004d40" text-anchor="middle">③ 발표</text><text x="745" y="345" font-size="25" fill="#222" text-anchor="middle">기업이 실적</text><text x="745" y="385" font-size="25" fill="#222" text-anchor="middle">공시</text><text x="888" y="360" font-size="40" fill="#00796b" text-anchor="middle">▶</text><rect x="905" y="220" width="250" height="260" rx="14" fill="#ffe0b2" stroke="#00796b" stroke-width="3"/><text x="1030" y="280" font-size="34" font-weight="bold" fill="#004d40" text-anchor="middle">④ 비교</text><text x="1030" y="345" font-size="25" fill="#222" text-anchor="middle">컨센서스 대비</text><text x="1030" y="385" font-size="25" fill="#222" text-anchor="middle">상회율 계산</text><text x="60" y="560" font-size="26" fill="#444">①~② 단계는 발표 전 전망치, ③ 단계부터 확정된 숫자입니다.</text></g></svg>
