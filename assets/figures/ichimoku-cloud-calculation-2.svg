<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<defs><pattern id="d" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="2" fill="#ece0cc"/></pattern></defs>
<rect width="1200" height="760" fill="#fff8ee"/><rect width="1200" height="760" fill="url(#d)"/>
<text x="60" y="88" font-family="Jua" font-size="50" fill="#2b2b2b">다섯 선은 어디에 그려질까</text>
<text x="62" y="138" font-family="Gaegu" font-weight="bold" font-size="34" fill="#9a7b55">오늘 계산한 값인데 그리는 칸이 달라요</text>
<line x1="90" y1="360" x2="1110" y2="360" stroke="#2b2b2b" stroke-width="6" stroke-linecap="round"/>
<circle cx="230" cy="360" r="18" fill="#9b7bd0" stroke="#2b2b2b" stroke-width="5"/>
<text x="230" y="430" font-family="Jua" font-size="40" text-anchor="middle" fill="#2b2b2b">26일 전</text>
<circle cx="600" cy="360" r="18" fill="#e35d5b" stroke="#2b2b2b" stroke-width="5"/>
<text x="600" y="430" font-family="Jua" font-size="40" text-anchor="middle" fill="#2b2b2b">오늘</text>
<circle cx="970" cy="360" r="18" fill="#4f9d6e" stroke="#2b2b2b" stroke-width="5"/>
<text x="970" y="430" font-family="Jua" font-size="40" text-anchor="middle" fill="#2b2b2b">26일 후</text>
<path d="M585 330 Q 417.5 240 250 330" fill="none" stroke="#9b7bd0" stroke-width="7" stroke-linecap="round"/>
<path d="M250 330 l 26 -24 M250 330 l 30 6" stroke="#9b7bd0" stroke-width="7" stroke-linecap="round"/>
<path d="M615 330 Q 782.5 240 950 330" fill="none" stroke="#4f9d6e" stroke-width="7" stroke-linecap="round"/>
<path d="M950 330 l -26 -24 M950 330 l -30 6" stroke="#4f9d6e" stroke-width="7" stroke-linecap="round"/>
<text x="410" y="220" font-family="Gaegu" font-weight="bold" font-size="34" text-anchor="middle" fill="#7a5bb0">후행스팬 = 오늘 종가</text>
<text x="790" y="220" font-family="Gaegu" font-weight="bold" font-size="34" text-anchor="middle" fill="#2f7a50">선행스팬1·2 = 구름</text>
<g transform="translate(600,510)"><rect x="-300" y="-40" width="600" height="110" rx="24" fill="#fff" stroke="#2b2b2b" stroke-width="5"/><text x="0" y="0" font-family="Jua" font-size="34" text-anchor="middle" fill="#2b2b2b">전환선·기준선은 오늘 칸에</text><text x="0" y="46" font-family="Gaegu" font-weight="bold" font-size="30" text-anchor="middle" fill="#9a7b55">그래서 구름은 차트 오른쪽 빈칸까지 보여요</text></g>
<text x="60" y="734" font-family="Jua" font-size="22" fill="#b8a98f">기본 설정 9·26·52 기준 · 일목산인(호소다 고이치)이 1969년 책으로 공개</text></svg>