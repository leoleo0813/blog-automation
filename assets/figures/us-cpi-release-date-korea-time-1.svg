<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<rect width="100%" height="100%" fill="#fff"/>
<text x="30" y="48" font-size="30" font-weight="bold" fill="#222">남은 미국 CPI 발표일과 한국시간 (2026년)</text>
<text x="30" y="86" font-size="22" fill="#555">미국 서머타임이 끝나는 11월 1일을 기준으로 한국시간이 한 시간 늦어져요</text>
<line x1="100" y1="290" x2="513" y2="290" stroke="#c2410c" stroke-width="8"/>
<line x1="513" y1="290" x2="1100" y2="290" stroke="#1d4ed8" stroke-width="8"/>
<line x1="513" y1="190" x2="513" y2="290" stroke="#555" stroke-width="3" stroke-dasharray="8 6"/>
<text x="513" y="150" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">11월 1일(일)</text>
<text x="513" y="182" font-size="22" text-anchor="middle" fill="#333">미국 서머타임 종료</text>
<text x="290" y="250" font-size="21" text-anchor="middle" fill="#c2410c">서머타임 중: 한국시간 = 미국 동부시간 + 13시간</text>
<text x="810" y="250" font-size="22" text-anchor="middle" fill="#1d4ed8">서머타임 끝: + 14시간</text>
<circle cx="273" cy="290" r="18" fill="#c2410c"/>
<circle cx="633" cy="290" r="18" fill="#1d4ed8"/>
<circle cx="1033" cy="290" r="18" fill="#1d4ed8"/>
<rect x="148" y="340" width="250" height="170" rx="12" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
<text x="273" y="382" font-size="26" font-weight="bold" text-anchor="middle" fill="#9a3412">10월 14일(수)</text>
<text x="273" y="422" font-size="22" text-anchor="middle" fill="#333">9월 지표</text>
<text x="273" y="462" font-size="26" font-weight="bold" text-anchor="middle" fill="#9a3412">밤 9시 30분</text>
<text x="273" y="495" font-size="20" text-anchor="middle" fill="#555">미국 오전 8:30</text>
<rect x="508" y="340" width="250" height="170" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="633" y="382" font-size="26" font-weight="bold" text-anchor="middle" fill="#1e3a8a">11월 10일(화)</text>
<text x="633" y="422" font-size="22" text-anchor="middle" fill="#333">10월 지표</text>
<text x="633" y="462" font-size="26" font-weight="bold" text-anchor="middle" fill="#1e3a8a">밤 10시 30분</text>
<text x="633" y="495" font-size="20" text-anchor="middle" fill="#555">미국 오전 8:30</text>
<rect x="908" y="340" width="250" height="170" rx="12" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
<text x="1033" y="382" font-size="26" font-weight="bold" text-anchor="middle" fill="#1e3a8a">12월 10일(목)</text>
<text x="1033" y="422" font-size="22" text-anchor="middle" fill="#333">11월 지표</text>
<text x="1033" y="462" font-size="26" font-weight="bold" text-anchor="middle" fill="#1e3a8a">밤 10시 30분</text>
<text x="1033" y="495" font-size="20" text-anchor="middle" fill="#555">미국 오전 8:30</text>
<text x="30" y="570" font-size="18" fill="#777">자료: 미국 노동통계국(BLS) 발표 일정을 옮긴 보도·정리 사이트 교차 확인, 2026-10-05 기준. 일정은 바뀔 수 있어요</text>
</svg>
