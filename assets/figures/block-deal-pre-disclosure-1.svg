<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="#ffffff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="60" y="70" font-size="38" font-weight="bold" fill="#111">블록딜 할인율별 확정가</text>
<text x="60" y="114" font-size="25" fill="#666">종가 10,000원 가정(예시 숫자), 100억원어치(100만 주) 기준</text>
<line x1="60" y1="600" x2="1140" y2="600" stroke="#999" stroke-width="2"/>
<rect x="110" y="200" width="200" height="400" fill="#b8c2d0"/>
<text x="210" y="185" font-size="32" font-weight="bold" fill="#333" text-anchor="middle">10,000원</text>
<text x="210" y="650" font-size="26" fill="#333" text-anchor="middle">종가</text>
<rect x="400" y="220" width="200" height="380" fill="#6fa8dc"/>
<text x="500" y="205" font-size="32" font-weight="bold" fill="#1a2744" text-anchor="middle">9,500원</text>
<text x="500" y="650" font-size="26" fill="#333" text-anchor="middle">5% 할인</text>
<text x="500" y="690" font-size="24" fill="#c0392b" text-anchor="middle">총 5억원 할인</text>
<rect x="690" y="228" width="200" height="372" fill="#4a90d9"/>
<text x="790" y="213" font-size="32" font-weight="bold" fill="#1a2744" text-anchor="middle">9,300원</text>
<text x="790" y="650" font-size="26" fill="#333" text-anchor="middle">7% 할인</text>
<text x="790" y="690" font-size="24" fill="#c0392b" text-anchor="middle">총 7억원 할인</text>
<rect x="980" y="240" width="160" height="360" fill="#2f6fb5"/>
<text x="1060" y="225" font-size="32" font-weight="bold" fill="#1a2744" text-anchor="middle">9,000원</text>
<text x="1060" y="650" font-size="26" fill="#333" text-anchor="middle">10% 할인</text>
<text x="1060" y="690" font-size="24" fill="#c0392b" text-anchor="middle">총 10억원 할인</text>
</g>
</svg>
