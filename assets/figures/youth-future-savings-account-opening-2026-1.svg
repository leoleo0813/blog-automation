<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="#ffffff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="70" y="78" font-size="36" font-weight="bold" fill="#111">월 50만원씩 3년 넣으면(이자 제외)</text>
<text x="70" y="122" font-size="25" fill="#666">내 돈 1,800만원 + 정부기여금</text>
<line x1="70" y1="580" x2="1130" y2="580" stroke="#999" stroke-width="2"/>
<rect x="140" y="241" width="260" height="339" fill="#9aa0a6" rx="6"/>
<text x="270" y="225" font-size="38" font-weight="bold" text-anchor="middle" fill="#111">1,800만원</text>
<text x="270" y="630" font-size="27" text-anchor="middle" fill="#333">내 납입 원금</text>
<rect x="470" y="220" width="260" height="360" fill="#1a2744" rx="6"/>
<text x="600" y="204" font-size="38" font-weight="bold" text-anchor="middle" fill="#111">1,908만원</text>
<text x="600" y="630" font-size="27" text-anchor="middle" fill="#333">일반형(+6%)</text>
<rect x="800" y="200" width="260" height="380" fill="#e67e22" rx="6"/>
<text x="930" y="184" font-size="38" font-weight="bold" text-anchor="middle" fill="#111">2,016만원</text>
<text x="930" y="630" font-size="27" text-anchor="middle" fill="#333">우대형(+12%)</text>
<text x="70" y="692" font-size="21" fill="#888">계산: 50만원×36개월=1,800만원, 기여금=납입액×6% 또는 12%. 은행 이자(비과세)는 별도</text>
</g></svg>