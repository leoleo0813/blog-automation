<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
<rect width="1200" height="640" fill="#ffffff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="70" y="78" font-size="36" font-weight="bold" fill="#111">거래량이 적은 종목은 200주에 체결강도가 3배 뛴다</text>
<text x="70" y="122" font-size="25" fill="#666">가정: 매수·매도가 같던 상태에서 매수 200주가 추가 체결 · 체결강도 변화</text>
<text x="70" y="206" font-size="27" font-weight="bold" fill="#333">거래 활발한 종목</text>
<text x="70" y="244" font-size="23" fill="#666">매수 10,000주 · 매도 10,000주</text>
<rect x="70" y="262" width="300" height="46" fill="#9aa5b1"/>
<text x="385" y="296" font-size="26" fill="#333">추가 전 100</text>
<rect x="70" y="322" width="306" height="46" fill="#2a6fd0"/>
<text x="395" y="356" font-size="26" font-weight="bold" fill="#2a6fd0">추가 후 102</text>
<text x="70" y="430" font-size="27" font-weight="bold" fill="#333">거래 드문 종목</text>
<text x="70" y="468" font-size="23" fill="#666">매수 100주 · 매도 100주</text>
<rect x="70" y="486" width="300" height="46" fill="#9aa5b1"/>
<text x="385" y="520" font-size="26" fill="#333">추가 전 100</text>
<rect x="70" y="546" width="900" height="46" fill="#d9534f"/>
<text x="985" y="580" font-size="26" font-weight="bold" fill="#d9534f">추가 후 300</text>
</g></svg>