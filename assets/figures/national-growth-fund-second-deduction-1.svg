<text x="70" y="650" font-size="22" fill="#666">가로: 전용계좌 투자금(원) / 세로: 소득공제액(원). 1억 원은 7천만 원 초과분에 공제율이 없어 1,800만 원 그대로</text>
<text x="70" y="684" font-size="21" fill="#888">자료: 금융위원회 발표를 보도한 정책뉴스·아주경제(2026-09), 구간별 합계는 직접 계산</text>
