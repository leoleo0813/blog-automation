<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
<rect width="1200" height="640" fill="#ffffff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="70" y="70" font-size="36" font-weight="bold" fill="#111">같은 20년, 보수만 다른 가상 결과</text>
<text x="70" y="112" font-size="25" fill="#666">1,000만원 일시 투자, 보수 차감 전 연 7% 가정 (계산 설명용 가상 값)</text>
<text x="70" y="190" font-size="26" fill="#111">연 보수 0.1%</text>
<rect x="70" y="205" width="911" height="64" fill="#f2b45c"/>
<text x="995" y="248" font-size="30" font-weight="bold" fill="#111">3,798만원</text>
<text x="70" y="330" font-size="26" fill="#111">연 보수 0.5%</text>
<rect x="70" y="345" width="846" height="64" fill="#e8943a"/>
<text x="930" y="388" font-size="30" font-weight="bold" fill="#111">3,524만원</text>
<text x="70" y="470" font-size="26" fill="#111">연 보수 1.0%</text>
<rect x="70" y="485" width="770" height="64" fill="#c9702a"/>
<text x="854" y="528" font-size="30" font-weight="bold" fill="#111">3,207만원</text>
<text x="600" y="600" font-size="26" text-anchor="middle" fill="#111">0.1%와 1.0%의 차이 = 591만원</text>
<text x="1130" y="628" font-size="22" text-anchor="end" fill="#888">계산: 1,000만원 × (1 + 7% − 보수)^20</text>
</g>
</svg>
