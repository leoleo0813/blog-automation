<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
<rect width="1200" height="640" fill="#ffffff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="70" y="78" font-size="36" font-weight="bold" fill="#111">한국에서는 10월 29일 새벽에 나와요</text>
<text x="70" y="122" font-size="25" fill="#666">마이크로소프트 실적 발표 일정 · 한국시간(KST)</text>
<line x1="110" y1="300" x2="1090" y2="300" stroke="#bbb" stroke-width="6"/>
<circle cx="200" cy="300" r="20" fill="#ea580c"/>
<circle cx="600" cy="300" r="20" fill="#2f6fd0"/>
<circle cx="1000" cy="300" r="20" fill="#1f9d55"/>
<text x="200" y="226" font-size="34" font-weight="bold" fill="#ea580c" text-anchor="middle">05:00</text>
<text x="200" y="372" font-size="27" font-weight="bold" fill="#222" text-anchor="middle">미국 정규장 마감</text>
<text x="200" y="410" font-size="24" fill="#555" text-anchor="middle">현지 28일 오후 4시</text>
<text x="600" y="226" font-size="34" font-weight="bold" fill="#2f6fd0" text-anchor="middle">마감 직후</text>
<text x="600" y="372" font-size="27" font-weight="bold" fill="#222" text-anchor="middle">실적·보도자료 공개</text>
<text x="600" y="410" font-size="24" fill="#555" text-anchor="middle">정확한 시각은 미공지</text>
<text x="1000" y="226" font-size="34" font-weight="bold" fill="#1f9d55" text-anchor="middle">06:30</text>
<text x="1000" y="372" font-size="27" font-weight="bold" fill="#222" text-anchor="middle">컨퍼런스콜 웹캐스트</text>
<text x="1000" y="410" font-size="24" fill="#555" text-anchor="middle">현지 오후 2시 30분(태평양)</text>
<rect x="70" y="470" width="1060" height="70" rx="10" fill="#fff7ed"/>
<text x="95" y="516" font-size="26" fill="#333">서머타임이 끝나는 11월 1일 이후에는 같은 현지 시각이 한국시간 1시간 늦어져요</text>
<text x="70" y="610" font-size="23" fill="#666">자료: 마이크로소프트 2026-10-07 보도자료(발표일·웹캐스트 시각), 시차는 직접 계산</text>
</g></svg>
