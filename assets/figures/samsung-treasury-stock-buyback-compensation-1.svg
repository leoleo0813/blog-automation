<text x="70" y="540" font-size="24" fill="#333">취득 5,685만 6,305주 · 14조 9,999억 원 · 목적은 임직원 주식보상(소각 아님)</text>
<text x="70" y="590" font-size="22" fill="#888">자료: 삼성전자 취득 결과 공시 보도(2026-10-12), 이사회 의결 보도(2026-08-21). 속이 빈 점은 예정</text></g></svg>
