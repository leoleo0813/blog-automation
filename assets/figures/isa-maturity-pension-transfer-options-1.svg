<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
<rect width="1200" height="640" fill="#ffffff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="70" y="78" font-size="36" font-weight="bold" fill="#111">ISA 만기 후 60일, 연금계좌 입금까지의 흐름</text>
<text x="70" y="122" font-size="25" fill="#666">가상 예시: 만기일 2026-12-10이면 60일째는 2027-02-08</text>
<line x1="120" y1="300" x2="1080" y2="300" stroke="#2a8aa0" stroke-width="6"/>
<circle cx="120" cy="300" r="22" fill="#2a8aa0"/>
<text x="120" y="236" font-size="32" font-weight="bold" fill="#2a8aa0" text-anchor="middle">0일</text>
<text x="120" y="370" font-size="26" fill="#333" text-anchor="middle">만기일·해지일</text>
<text x="120" y="406" font-size="24" fill="#666" text-anchor="middle">2026-12-10</text>
<circle cx="440" cy="300" r="22" fill="#2a8aa0"/>
<text x="440" y="236" font-size="32" font-weight="bold" fill="#2a8aa0" text-anchor="middle">먼저</text>
<text x="440" y="370" font-size="26" fill="#333" text-anchor="middle">연금저축·IRP</text>
<text x="440" y="406" font-size="24" fill="#666" text-anchor="middle">계좌 준비</text>
<circle cx="760" cy="300" r="22" fill="#2a8aa0"/>
<text x="760" y="236" font-size="32" font-weight="bold" fill="#2a8aa0" text-anchor="middle">그다음</text>
<text x="760" y="370" font-size="26" fill="#333" text-anchor="middle">현금화 후 입금</text>
<text x="760" y="406" font-size="24" fill="#666" text-anchor="middle">입금 처리 확인</text>
<circle cx="1080" cy="300" r="22" fill="#c0392b"/>
<text x="1080" y="236" font-size="32" font-weight="bold" fill="#c0392b" text-anchor="middle">60일</text>
<text x="1080" y="370" font-size="26" fill="#333" text-anchor="middle">입금 마감</text>
<text x="1080" y="406" font-size="24" fill="#666" text-anchor="middle">2027-02-08</text>
<rect x="70" y="470" width="1060" height="64" rx="10" fill="#fdecea"/>
<text x="600" y="512" font-size="26" fill="#a93226" text-anchor="middle" font-weight="bold">입금한 해(연도)에 추가 공제 한도가 붙습니다. 12/31 전후로 갈립니다</text>
<text x="70" y="590" font-size="22" fill="#888">60일 기준은 금융사·언론 안내 기준이며 기산일(만기일 또는 해지일)은 금융사별로 안내가 다를 수 있음</text></g></svg>