<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="#ffffff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="60" y="70" font-size="38" font-weight="bold" fill="#111">대주주 거래계획 사전공시 일정</text>
<text x="60" y="114" font-size="25" fill="#666">지분 1% 이상 또는 거래금액 50억원 이상을 팔려는 임원·주요주주</text>
<line x1="80" y1="330" x2="1120" y2="330" stroke="#444" stroke-width="5"/>
<rect x="150" y="290" width="470" height="80" fill="#dbeafe" stroke="#4a90d9" stroke-width="3"/>
<text x="385" y="340" font-size="30" font-weight="bold" fill="#1a2744" text-anchor="middle">보고 가능 구간</text>
<circle cx="150" cy="330" r="16" fill="#4a90d9"/>
<circle cx="620" cy="330" r="16" fill="#4a90d9"/>
<circle cx="900" cy="330" r="22" fill="#c0392b"/>
<text x="150" y="250" font-size="30" font-weight="bold" fill="#1a2744" text-anchor="middle">거래 90일 전</text>
<text x="620" y="250" font-size="30" font-weight="bold" fill="#1a2744" text-anchor="middle">거래 30일 전</text>
<text x="900" y="250" font-size="30" font-weight="bold" fill="#c0392b" text-anchor="middle">거래 개시일</text>
<text x="760" y="420" font-size="26" fill="#555" text-anchor="middle">최소 30일의 예고 기간</text>
<line x1="625" y1="395" x2="895" y2="395" stroke="#999" stroke-width="3"/>
<rect x="900" y="300" width="200" height="60" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
<text x="1000" y="340" font-size="28" font-weight="bold" fill="#c0392b" text-anchor="middle">거래 기간</text>
<rect x="80" y="500" width="1040" height="150" rx="14" fill="#f6f6f4" stroke="#bbb" stroke-width="2"/>
<text x="110" y="555" font-size="28" fill="#222">공시 내용: 매매 목적, 가격, 수량, 거래 기간</text>
<text x="110" y="605" font-size="28" fill="#222">실제 거래는 계획 금액의 30% 이내 오차까지 허용</text>
</g>
</svg>
