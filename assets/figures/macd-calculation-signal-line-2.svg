<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
<rect width="1200" height="640" fill="#ffffff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="70" y="78" font-size="36" font-weight="bold" fill="#111">같은 가격에서 신호가 나온 순서</text>
<text x="70" y="122" font-size="25" fill="#666">오르기 시작한 뒤 → 꺾인 뒤 (가정 가격 예시)</text>
<line x1="80" y1="380" x2="1120" y2="380" stroke="#9aa0a6" stroke-width="4"/>
<circle cx="110" cy="380" r="13" fill="#2e8b57"/>
<line x1="110" y1="350" x2="110" y2="310" stroke="#2e8b57" stroke-width="3"/>
<text x="110" y="202" font-size="25" font-weight="bold" text-anchor="middle" fill="#2e8b57">39일째</text>
<text x="110" y="236" font-size="21" text-anchor="middle" fill="#333">MACD↑시그널</text>
<text x="110" y="266" font-size="21" text-anchor="middle" fill="#333">가장 빠름</text>
<circle cx="355" cy="380" r="13" fill="#8aa4d6"/>
<line x1="355" y1="410" x2="355" y2="450" stroke="#8aa4d6" stroke-width="3"/>
<text x="355" y="486" font-size="25" font-weight="bold" text-anchor="middle" fill="#8aa4d6">44일째</text>
<text x="355" y="518" font-size="21" text-anchor="middle" fill="#333">5·20일 이평</text>
<text x="355" y="548" font-size="21" text-anchor="middle" fill="#333">골든크로스</text>
<circle cx="600" cy="380" r="13" fill="#1a2744"/>
<line x1="600" y1="350" x2="600" y2="310" stroke="#1a2744" stroke-width="3"/>
<text x="600" y="202" font-size="25" font-weight="bold" text-anchor="middle" fill="#1a2744">48일째</text>
<text x="600" y="236" font-size="21" text-anchor="middle" fill="#333">MACD 0선↑</text>
<text x="600" y="266" font-size="21" text-anchor="middle" fill="#333">(=12·26 EMA 교차)</text>
<circle cx="845" cy="380" r="13" fill="#c0392b"/>
<line x1="845" y1="410" x2="845" y2="450" stroke="#c0392b" stroke-width="3"/>
<text x="845" y="486" font-size="25" font-weight="bold" text-anchor="middle" fill="#c0392b">64일째</text>
<text x="845" y="518" font-size="21" text-anchor="middle" fill="#333">MACD↓시그널</text>
<text x="845" y="548" font-size="21" text-anchor="middle" fill="#333">꺾임 먼저</text>
<circle cx="1090" cy="380" r="13" fill="#e67e22"/>
<line x1="1090" y1="350" x2="1090" y2="310" stroke="#e67e22" stroke-width="3"/>
<text x="1090" y="202" font-size="25" font-weight="bold" text-anchor="middle" fill="#e67e22">71일째</text>
<text x="1090" y="236" font-size="21" text-anchor="middle" fill="#333">5·20일 이평</text>
<text x="1090" y="266" font-size="21" text-anchor="middle" fill="#333">데드크로스</text>
<text x="70" y="612" font-size="21" fill="#888">빠른 신호일수록 일찍 알려 주지만 가짜 신호도 많아요(35~38일째 3번 엇갈림)</text>
</g></svg>