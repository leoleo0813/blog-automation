<text x="760" y="600" font-size="30" fill="#444">12월 18일(금)</text>
<text x="1110" y="600" font-size="28" font-weight="bold" fill="#d97706" text-anchor="end">남음</text>
<text x="70" y="690" font-size="22" fill="#888">2026년 날짜는 요일 규칙을 달력에 적용한 값 · 자료: 한국거래소 만기 구조, 언론 보도 교차 확인</text>
</g></svg>