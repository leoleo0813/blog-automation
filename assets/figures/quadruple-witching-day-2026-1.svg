<text x="470" y="372" font-size="30" font-weight="bold" fill="#444">6월 11일(목)</text>
<text x="760" y="372" font-size="30" fill="#444">6월 19일(금)</text>
<text x="1110" y="372" font-size="28" font-weight="bold" fill="#888" text-anchor="end">지남</text>
<rect x="70" y="428" width="1060" height="96" rx="10" fill="#f6f6f4"/>
<rect x="70" y="428" width="14" height="96" fill="#a8a29e"/>
<text x="110" y="486" font-size="32" font-weight="bold" fill="#111">3차</text>
<text x="470" y="486" font-size="30" font-weight="bold" fill="#444">9월 10일(목)</text>
<text x="760" y="486" font-size="30" fill="#444">9월 18일(금)</text>
<text x="1110" y="486" font-size="28" font-weight="bold" fill="#888" text-anchor="end">지남</text>
<rect x="70" y="542" width="1060" height="96" rx="10" fill="#fff8e6"/>
<rect x="70" y="542" width="14" height="96" fill="#d97706"/>
