<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="#ffffff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="70" y="78" font-size="36" font-weight="bold" fill="#111">2026년 네마녀의 날, 한국과 미국</text>
<text x="70" y="122" font-size="25" fill="#666">한국은 둘째주 목요일, 미국은 셋째주 금요일 · 2026-10-10 기준</text>
<text x="470" y="176" font-size="26" font-weight="bold" fill="#92400e">한국(코스피)</text>
<text x="760" y="176" font-size="26" font-weight="bold" fill="#475569">미국(뉴욕)</text>
<rect x="70" y="200" width="1060" height="96" rx="10" fill="#f6f6f4"/>
<rect x="70" y="200" width="14" height="96" fill="#a8a29e"/>
<text x="110" y="258" font-size="32" font-weight="bold" fill="#111">1차</text>
<text x="470" y="258" font-size="30" font-weight="bold" fill="#444">3월 12일(목)</text>
<text x="760" y="258" font-size="30" fill="#444">3월 20일(금)</text>
<text x="1110" y="258" font-size="28" font-weight="bold" fill="#888" text-anchor="end">지남</text>
<rect x="70" y="314" width="1060" height="96" rx="10" fill="#f6f6f4"/>
<rect x="70" y="314" width="14" height="96" fill="#a8a29e"/>
