<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="#ffffff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="70" y="78" font-size="36" font-weight="bold" fill="#111">2026년 10월 분기 분배금 일정 (두 ETF 공통 추정)</text>
<text x="70" y="122" font-size="25" fill="#666">1·4·7·10월 마지막 영업일 기준, 매수 결제는 2영업일</text>
<line x1="120" y1="360" x2="1080" y2="360" stroke="#bbb" stroke-width="6"/>
<circle cx="180" cy="360" r="20" fill="#d97706"/>
<text x="180" y="290" font-size="34" font-weight="bold" fill="#d97706" text-anchor="middle">10/28(수)</text>
<text x="180" y="440" font-size="28" font-weight="bold" fill="#222" text-anchor="middle">마지막 매수일</text>
<text x="180" y="482" font-size="22" fill="#555" text-anchor="middle">이날 사면 10/30 결제</text>
<circle cx="460" cy="360" r="20" fill="#777"/>
<text x="460" y="290" font-size="34" font-weight="bold" fill="#777" text-anchor="middle">10/29(목)</text>
<text x="460" y="440" font-size="28" font-weight="bold" fill="#222" text-anchor="middle">분배락일 추정</text>
<text x="460" y="482" font-size="22" fill="#555" text-anchor="middle">기준가가 분배금만큼 조정</text>
<circle cx="740" cy="360" r="20" fill="#1a2744"/>
<text x="740" y="290" font-size="34" font-weight="bold" fill="#1a2744" text-anchor="middle">10/30(금)</text>
<text x="740" y="440" font-size="28" font-weight="bold" fill="#222" text-anchor="middle">기준일 추정</text>
<text x="740" y="482" font-size="22" fill="#555" text-anchor="middle">이날 보유해야 분배금 받음</text>
<circle cx="1020" cy="360" r="20" fill="#0f766e"/>
<text x="1020" y="290" font-size="34" font-weight="bold" fill="#0f766e" text-anchor="middle">11/3(화)</text>
<text x="1020" y="440" font-size="28" font-weight="bold" fill="#222" text-anchor="middle">지급일 추정</text>
<text x="1020" y="482" font-size="22" fill="#555" text-anchor="middle">분배금 입금</text>
<text x="600" y="580" font-size="24" fill="#555" text-anchor="middle">10/31(토)·11/1(일)은 휴장, 기준일 뒤 2영업일(11/2, 11/3)이 지나 지급</text>
<text x="70" y="692" font-size="21" fill="#888">자료: 미래에셋·삼성자산운용 분기 분배 안내, 2025-10 지급 패턴. 공시 전 추정, 2026-10-23</text>
</g></svg>