<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640">
<rect width="1200" height="640" fill="#ffffff"/>
<g font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
<text x="70" y="78" font-size="36" font-weight="bold" fill="#111">환노출형은 지수와 환율이 함께 곱해진다</text>
<text x="70" y="122" font-size="25" fill="#666">S&amp;P500 지수가 10% 오른 해, 환율 변화별 원화 수익률 · 가상 계산</text>
<line x1="640" y1="160" x2="640" y2="400" stroke="#999" stroke-width="2"/>
<text x="70" y="226" font-size="26" fill="#333">환율 10% 상승</text>
<rect x="640" y="190" width="363" height="52" fill="#2a9d5c"/>
<text x="1015" y="227" font-size="28" font-weight="bold" fill="#2a9d5c">+21.0%</text>
<text x="70" y="294" font-size="26" fill="#333">환율 변화 없음</text>
<rect x="640" y="258" width="150" height="52" fill="#2a9d5c"/>
<text x="802" y="295" font-size="28" font-weight="bold" fill="#2a9d5c">+10.0%</text>
<text x="70" y="362" font-size="26" fill="#333">환율 10% 하락</text>
<rect x="637" y="326" width="3" height="52" fill="#d9534f"/>
<text x="652" y="363" font-size="28" font-weight="bold" fill="#d9534f">-1.0%</text>
<text x="70" y="450" font-size="26" fill="#333">계산: (1+지수 수익률) × (1+환율 변화) - 1</text>
<text x="70" y="496" font-size="26" fill="#333">환헤지형(H)은 환율 항이 빠져 지수 수익률에 가깝게 움직임</text>
<text x="70" y="580" font-size="24" fill="#666">세금·수수료·헤지비용 제외한 산술 예시, 실제 수익률 아님</text>
</g></svg>
