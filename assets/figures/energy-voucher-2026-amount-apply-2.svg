<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<defs><pattern id="d" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="2" fill="#ece0cc"/></pattern></defs>
<rect width="1200" height="760" fill="#fff8ee"/><rect width="1200" height="760" fill="url(#d)"/>
<text x="60" y="88" font-family="Jua" font-size="50" fill="#2b2b2b">나는 에너지바우처 대상일까</text>
<text x="62" y="138" font-family="Gaegu" font-weight="bold" font-size="34" fill="#9a7b55">두 조건이 겹쳐야 받을 수 있어요</text>
<circle cx="455" cy="440" r="250" fill="#8fb3e8" fill-opacity="0.55" stroke="#2b2b2b" stroke-width="5"/>
<circle cx="745" cy="440" r="250" fill="#f39c7a" fill-opacity="0.55" stroke="#2b2b2b" stroke-width="5"/>
<text x="330" y="350" font-family="Jua" font-size="38" text-anchor="middle" fill="#2b2b2b">소득 기준</text>
<text x="330" y="405" font-family="Gaegu" font-weight="bold" font-size="32" text-anchor="middle" fill="#2b2b2b">기초생활수급자</text>
<text x="330" y="447" font-family="Gaegu" font-weight="bold" font-size="32" text-anchor="middle" fill="#2b2b2b">생계·의료·주거·</text>
<text x="330" y="489" font-family="Gaegu" font-weight="bold" font-size="32" text-anchor="middle" fill="#2b2b2b">교육급여 중 하나</text>
<text x="870" y="350" font-family="Jua" font-size="38" text-anchor="middle" fill="#2b2b2b">세대원 기준</text>
<text x="870" y="405" font-family="Gaegu" font-weight="bold" font-size="32" text-anchor="middle" fill="#2b2b2b">노인·영유아·</text>
<text x="870" y="447" font-family="Gaegu" font-weight="bold" font-size="32" text-anchor="middle" fill="#2b2b2b">장애인·다자녀</text>
<text x="870" y="489" font-family="Gaegu" font-weight="bold" font-size="32" text-anchor="middle" fill="#2b2b2b">가구 등</text>
<g transform="translate(600,440) rotate(-4)"><rect x="-80" y="-38" width="160" height="76" rx="38" fill="#fff" stroke="#2b2b2b" stroke-width="5"/><text x="0" y="14" font-family="Jua" font-size="40" text-anchor="middle" fill="#d0452f">대상!</text></g>
<text x="60" y="734" font-family="Jua" font-size="22" fill="#b8a98f">수급자여도 세대원 기준에 맞는 가족이 없으면 대상이 아니에요</text></svg>