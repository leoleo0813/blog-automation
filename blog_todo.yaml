# 글 단위가 아닌 블로그 전체 할 일. human_todo.py가 사용자_할일.md 맨 위에 보여 준다.
# 끝낸 항목은 done: true로 바꾸면 목록에서 빠진다.
# 2026-10-07 추가: 사용자 "조회수가 늘어나는 조짐이 보이질 않는다" — 먼저 검색엔진에 글이 등록(색인)됐는지부터 확인한다.
- id: google-search-console
  title: 구글 서치 콘솔에 블로그 등록하고 사이트맵 제출
  why: 티스토리 방문은 대부분 구글과 다음에서 옵니다. 구글에 블로그를 알려 주지 않으면 글이 검색에 아예 안 나올 수 있고, 지금은 글이 몇 개나 등록됐는지조차 알 수 없습니다.
  steps:
    - "https://search.google.com/search-console 접속(구글 계정 로그인) → 이미 등록돼 있으면 3번으로"
    - "속성 추가 → 오른쪽 'URL 접두어'에 https://sensitiveboss3.tistory.com 입력 → 확인 방법 'HTML 태그' 선택 → 나온 <meta ...> 한 줄 복사"
    - "티스토리 관리 → 꾸미기 → 스킨 편집 → html 편집 → <head> 바로 아래에 붙여 넣고 적용 → 서치 콘솔로 돌아와 '확인' (티스토리 관리 → 플러그인에 '구글 서치 콘솔'이 있으면 그걸로 연결해도 됩니다)"
    - "서치 콘솔 왼쪽 'Sitemaps' → https://sensitiveboss3.tistory.com/sitemap.xml 입력 → 제출"
    - "2~3일 뒤 왼쪽 '페이지' 메뉴 화면 캡처(색인 생성됨/생성되지 않음 숫자와 아래 이유 목록)"
  must_show:
    - "'색인이 생성된 페이지' 숫자와 '색인이 생성되지 않은 페이지' 숫자"
    - "생성되지 않은 이유 목록(예: 크롤링됨 - 현재 색인이 생성되지 않음)"
  minutes: 10
  device: PC 권장
  send: "블로그 서치콘솔"
- id: naver-search-advisor
  title: 네이버 서치어드바이저 등록하고 사이트맵·RSS 제출
  why: 네이버는 자기 블로그를 먼저 보여 줘서 티스토리 노출이 적지만, 등록해 두지 않으면 웹문서 검색에도 거의 안 나옵니다.
  steps:
    - "https://searchadvisor.naver.com 접속(네이버 로그인) → 오른쪽 위 '웹마스터 도구'"
    - "사이트 등록에 https://sensitiveboss3.tistory.com 입력 → 'HTML 태그' 방식 선택 → <meta ...> 복사해 구글 때와 같은 자리(<head> 아래)에 붙여 넣기 → 소유 확인"
    - "등록된 사이트 클릭 → 요청 → 사이트맵 제출에 https://sensitiveboss3.tistory.com/sitemap.xml 제출"
    - "같은 화면 RSS 제출에 https://sensitiveboss3.tistory.com/rss 제출"
    - "제출 완료 화면 캡처"
  must_show:
    - "사이트맵·RSS 제출 목록에 두 주소가 보이는 화면"
  minutes: 7
  device: PC 권장
  send: "블로그 네이버등록"
- id: tistory-stats
  title: 티스토리 통계 — 9월 많던 날과 10월 떨어진 날의 유입 경로 비교
  why: "10월 7일 통계 받음(누적 조회 2,732, 오늘 다음 검색 2·구글 0·네이버 0). 그래프가 9/17~10/1에 높다가 10/2부터 거의 0이 됐는데, 아래 유입 표는 선택한 날 하루치만 보여 줘서 9월 방문이 어디서 왔고 왜 끊겼는지 아직 알 수 없습니다."
  steps:
    - "티스토리 관리 → 통계 → 방문 통계(지금 보신 화면)"
    - "그래프에서 9월 25일(가장 높은 막대)을 눌러 아래 '검색·SNS·기타' 표와 '인기글'이 그날 것으로 바뀐 화면 캡처"
    - "같은 방법으로 9월 29일 막대를 눌러 캡처"
    - "같은 방법으로 10월 2일 막대를 눌러 캡처"
    - "왼쪽 메뉴 통계 → '유입 경로' 화면(기간 가장 길게)이 따로 있으면 그것도 캡처"
  must_show:
    - "그래프 위 날짜(2026.09.25 등)"
    - "검색(다음·네이버·구글 숫자), 기타(직접 유입·기타 유입) 숫자"
    - "그날 인기글 목록"
  minutes: 4
  device: PC 권장
  send: "블로그 통계2"
- id: blog-address-check
  title: 블로그 주소가 두 개인지 확인
  why: "통계 화면 왼쪽 블로그 이름 아래 주소가 '3.sensitiveboss.com'처럼 보입니다. 개인 도메인을 연결했다면 구글·네이버 등록과 글 안 링크를 그 주소 기준으로 맞춰야 합니다."
  steps:
    - "휴대폰이나 PC에서 https://sensitiveboss3.tistory.com 을 열기"
    - "열린 뒤 주소창에 보이는 주소를 캡처(주소가 바뀌면 그 바뀐 주소가 진짜 주소)"
    - "티스토리 관리 → 관리 → 블로그 → '개인 도메인 설정' 화면이 있으면 캡처"
  must_show:
    - "주소창의 주소"
    - "개인 도메인 설정 여부"
  minutes: 2
  device: 휴대폰 가능
  send: "블로그 주소"
- id: publish-cadence
  title: 밀린 초안은 하루 2편씩 예약 발행
  why: 지금까지 하루에 24~29편씩 몰아서 올린 날이 세 번 있습니다. 새 블로그가 짧은 기간에 비슷한 형식의 글을 대량으로 올리면 구글이 색인을 늦추거나 일부만 등록하는 경우가 많습니다. 같은 글이라도 매일 고르게 올리는 편이 안전합니다.
  steps:
    - "티스토리 글쓰기 → HTML 붙여 넣기 → 오른쪽 아래 '완료' 옆 발행 설정에서 '예약' 선택 → 날짜·시간 지정"
    - "하루 2편씩, 오전·오후 한 편씩 같은 시간대로 예약(밀린 41편이면 약 3주 분량)"
    - "따로 보낼 자료는 없습니다. 이렇게 하기로 했으면 '예약 발행 시작'이라고만 알려 주세요"
  must_show: []
  minutes: 3
  device: PC 권장
  send: "예약 발행 시작"
  done: false
