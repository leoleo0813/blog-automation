# 글 단위가 아닌 블로그 전체 할 일. human_todo.py가 사용자_할일.md 맨 위에 보여 준다.
# 끝낸 항목은 done: true로 바꾸면 목록에서 빠진다.
# 2026-10-07 추가: 사용자 "조회수가 늘어나는 조짐이 보이질 않는다" — 먼저 검색엔진에 글이 등록(색인)됐는지부터 확인한다.
- id: google-search-console
  title: 구글 서치 콘솔 결과 화면 3장 캡처(등록은 이미 돼 있음)
  why: "2026-10-07 사용자 확인: 구글·네이버 모두 등록돼 있음. 그런데 10/7 유입은 구글 0이라, 글이 구글에 몇 개나 들어갔는지(색인)와 검색에 얼마나 보였는지(노출)를 봐야 원인을 고를 수 있습니다."
  steps:
    - "https://search.google.com/search-console 접속 → 왼쪽 위에서 이 블로그 속성 선택(어떤 주소로 등록돼 있는지도 보이게)"
    - "왼쪽 '페이지'(색인 생성 아래) → 맨 위 '색인이 생성되지 않음 / 색인 생성됨' 숫자와 그래프, 아래 '페이지가 색인되지 않는 이유' 표까지 캡처"
    - "왼쪽 '실적' → 기간 '3개월' → 총 클릭수·총 노출수 그래프와 아래 '검색어' 목록 캡처"
    - "왼쪽 'Sitemaps' → 제출한 사이트맵 목록(상태, 발견된 페이지 수) 캡처. 목록이 비어 있으면 https://sensitiveboss3.tistory.com/sitemap.xml 제출 후 캡처"
  must_show:
    - "색인 생성됨 숫자와 색인 안 됨 숫자, 안 된 이유별 페이지 수"
    - "3개월 총 노출수·클릭수, 검색어 목록"
    - "사이트맵 상태(성공 여부)와 발견된 페이지 수"
  minutes: 5
  device: PC 권장
  send: "블로그 서치콘솔"
- id: naver-search-advisor
  title: 네이버 서치어드바이저 결과 화면 캡처(등록은 이미 돼 있음)
  why: "네이버 유입도 0이라, 네이버가 글을 몇 개나 수집·반영했는지 확인합니다."
  steps:
    - "https://searchadvisor.naver.com → 웹마스터 도구 → 블로그 주소 클릭"
    - "왼쪽 '리포트' → '검색 노출'(또는 '검색 반영') 그래프 캡처"
    - "왼쪽 '요청' → '사이트맵 제출'과 'RSS 제출' 화면 캡처(목록과 수집 상태가 보이게)"
  must_show:
    - "노출·반영 그래프와 숫자"
    - "사이트맵·RSS 제출 여부와 상태"
  minutes: 4
  device: PC 권장
  send: "블로그 네이버"
- id: tistory-stats
  title: 티스토리 통계 — 9월 많던 날과 10월 떨어진 날의 유입 경로 비교
  why: "10월 7일 통계 받음(누적 조회 2,732, 오늘 다음 검색 2·구글 0·네이버 0). 그래프가 9/17~10/1에 높다가 10/2부터 거의 0이 됐는데, 아래 유입 표는 선택한 날 하루치만 보여 줘서 9월 방문이 어디서 왔고 왜 끊겼는지 아직 알 수 없습니다."
  steps:
    - "티스토리 관리 → 통계 → 방문 통계(지금 보신 화면)"
    - "그래프에서 9월 25일(가장 높은 막대)을 눌러 아래 '검색·SNS·기타' 표와 '인기글'이 그날 것으로 바뀐 화면 캡처"
    - "같은 방법으로 9월 29일 막대를 눌러 캡처"
    - "같은 방법으로 10월 2일 막대를 눌러 캡처"
    - "왼쪽 메뉴 통계 → '유입 경로' 화면(기간 가장 길게)이 따로 있으면 그것도 캡처"
  must_show:
    - "그래프 위 날짜(2026.09.25 등)"
    - "검색(다음·네이버·구글 숫자), 기타(직접 유입·기타 유입) 숫자"
    - "그날 인기글 목록"
  minutes: 4
  device: PC 권장
  send: "블로그 통계2"
- id: blog-address-check
  title: 블로그 주소가 두 개인지 확인
  why: "통계 화면 왼쪽 블로그 이름 아래 주소가 '3.sensitiveboss.com'처럼 보입니다. 개인 도메인을 연결했다면 구글·네이버 등록과 글 안 링크를 그 주소 기준으로 맞춰야 합니다."
  steps:
    - "휴대폰이나 PC에서 https://sensitiveboss3.tistory.com 을 열기"
    - "열린 뒤 주소창에 보이는 주소를 캡처(주소가 바뀌면 그 바뀐 주소가 진짜 주소)"
    - "티스토리 관리 → 관리 → 블로그 → '개인 도메인 설정' 화면이 있으면 캡처"
  must_show:
    - "주소창의 주소"
    - "개인 도메인 설정 여부"
  minutes: 2
  device: 휴대폰 가능
  send: "블로그 주소"
- id: publish-cadence
  title: 밀린 초안은 하루 2편씩 예약 발행
  why: 지금까지 하루에 24~29편씩 몰아서 올린 날이 세 번 있습니다. 새 블로그가 짧은 기간에 비슷한 형식의 글을 대량으로 올리면 구글이 색인을 늦추거나 일부만 등록하는 경우가 많습니다. 같은 글이라도 매일 고르게 올리는 편이 안전합니다.
  steps:
    - "티스토리 글쓰기 → HTML 붙여 넣기 → 오른쪽 아래 '완료' 옆 발행 설정에서 '예약' 선택 → 날짜·시간 지정"
    - "하루 2편씩, 오전·오후 한 편씩 같은 시간대로 예약(밀린 41편이면 약 3주 분량)"
    - "따로 보낼 자료는 없습니다. 이렇게 하기로 했으면 '예약 발행 시작'이라고만 알려 주세요"
  must_show: []
  minutes: 3
  device: PC 권장
  send: "예약 발행 시작"
  done: false
