name: Fetch primary sources (gate 4)

on:
  workflow_dispatch:
    inputs:
      name:
        description: '저장할 이름 (sources/<이름>.md 로 저장)'
        required: true
        type: string
      urls:
        description: '1차 출처 URL (쉼표 구분)'
        required: true
        type: string

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      - name: Fetch sources
        run: |
          IFS=',' read -ra URLS <<< "${{ inputs.urls }}"
          ARGS=()
          for u in "${URLS[@]}"; do
            ARGS+=("$(echo "$u" | sed 's/^ *//;s/ *$//')")
          done
          python -m blog_automation.fetch_source "${{ inputs.name }}" "${ARGS[@]}"

      - name: Commit fetched sources
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "1차 출처 원문 수집: ${{ inputs.name }}"
          # 다른 세션(Routine 등)이 동시에 push 하면 rejected 되므로 rebase 후 재시도한다.
          for i in 1 2 3; do
            if git push; then exit 0; fi
            echo "push 거절됨 — rebase 후 재시도 ($i/3)"
            git pull --rebase origin main || exit 1
          done
          exit 1
