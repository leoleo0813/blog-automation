name: Notify repo-only content (no Blogger publish)

on:
  workflow_dispatch:
    inputs:
      post_file:
        description: 'pending_posts/*.json 또는 stock_drafts/*.md 경로'
        required: true
        type: string

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      # 주식 초안(.md)이면 네이버 검색광고 API로 게이트 1(월간 검색량)을 채운다.
      # 시크릿이 없거나 조회에 실패하면 '확인필요' 상태가 그대로 남는다.
      - name: Fill search volume (gate 1)
        run: python -m blog_automation.fill_search_volume "${{ inputs.post_file }}"
        env:
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
          NAVER_AD_ACCESS_LICENSE: ${{ secrets.NAVER_AD_ACCESS_LICENSE }}
          NAVER_AD_SECRET_KEY: ${{ secrets.NAVER_AD_SECRET_KEY }}

      - name: Commit filled search volume
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "게이트 1: 네이버 키워드도구 검색량 자동 기입"
            git push
          else
            echo "검색량 변경 없음 - 커밋 생략"
          fi

      - name: Send Kakao notification
        run: python -m blog_automation.notify_repo_only "${{ inputs.post_file }}"
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
