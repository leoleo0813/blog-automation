name: Notify repo-only content (no Blogger publish)

on:
  workflow_dispatch:
    inputs:
      post_file:
        description: 'pending_posts/ 안의 JSON 파일 경로'
        required: true
        type: string

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m blog_automation.notify_repo_only "${{ inputs.post_file }}"
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
