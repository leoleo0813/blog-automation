name: Check keyword volumes from request file (for scheduled sessions)

# 예약 작업 세션에는 GitHub Actions 실행 도구가 없어서, keyword_requests/request.txt(쉼표 구분 키워드)를
# 커밋·푸시하면 이 워크플로가 검색량을 재서 keyword_requests/result.txt로 커밋한다. 2026-11-20.
on:
  push:
    branches: [main]
    paths: ['keyword_requests/request.txt']

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Check search volumes
        run: |
          IFS=',' read -ra KWS <<< "$(tr -d '\r\n' < keyword_requests/request.txt)"
          ARGS=()
          for kw in "${KWS[@]}"; do
            k="$(echo "$kw" | sed 's/^ *//;s/ *$//')"
            [ -n "$k" ] && ARGS+=("$k")
          done
          {
            echo "요청 커밋: ${GITHUB_SHA}"
            echo "측정 시각(UTC): $(date -u '+%Y-%m-%d %H:%M')"
            python -m blog_automation.check_keywords "${ARGS[@]}"
          } > keyword_requests/result.txt 2>&1
          cat keyword_requests/result.txt
        env:
          NAVER_AD_CUSTOMER_ID: ${{ secrets.NAVER_AD_CUSTOMER_ID }}
          NAVER_AD_ACCESS_LICENSE: ${{ secrets.NAVER_AD_ACCESS_LICENSE }}
          NAVER_AD_SECRET_KEY: ${{ secrets.NAVER_AD_SECRET_KEY }}
      - name: Commit result
        run: |
          git config user.name "keyword-bot"
          git config user.email "keyword-bot@users.noreply.github.com"
          git add keyword_requests/result.txt
          git commit -m "검색량 측정 결과 [skip ci]" || exit 0
          git pull --rebase origin main && git push origin main
